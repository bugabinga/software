<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
{{meta_head}}
<link rel="icon" href="{{prefix}}assets/favicon.svg">
<link rel="stylesheet" href="{{prefix}}assets/book.css">
<!-- Whatever Typst needs in <head>; currently the MathML stylesheet. -->
{{typst_head}}
<script>
  // Apply the saved theme before first paint, so the page never flashes.
  try {
    var saved = localStorage.getItem("book-theme");
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>
<body data-prefix="{{prefix}}">
<a class="skip-link" href="#content">Skip to content</a>

<header class="topbar">
  <button class="icon-button sidebar-toggle" aria-label="Contents" aria-expanded="false">☰</button>
  <a class="topbar-title" href="{{prefix}}">{{book_title}}</a>
  <div class="topbar-actions">
    <button class="search-open" aria-label="Search (press /)">Search <kbd>/</kbd></button>
    <a class="pdf-link" href="{{prefix}}book.pdf">PDF</a>
    <button class="icon-button theme-toggle" aria-label="Switch theme">◐</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar">
    {{nav}}
  </div>

  <main class="content" id="content">
    <article class="chapter">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{chapter_title}}</h1>
      {{page_toc}}
      {{content}}
    </article>
    {{pager}}
    <footer class="chapter-footer">
      {{edit_link}}
      <span class="edition">{{edition}}</span>
    </footer>
  </main>
</div>

<dialog class="search-dialog">
  <form class="search-form" method="dialog">
    <input class="search-input" type="search" placeholder="Search the book" aria-label="Search the book" autocomplete="off">
    <button class="search-close" aria-label="Close">esc</button>
  </form>
  <div class="search-results" role="listbox" aria-label="Search results"></div>
</dialog>

<script src="{{prefix}}assets/book.js"></script>
{{dev_script}}
</body>
</html>
