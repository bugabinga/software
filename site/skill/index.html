<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Notes inbox — skill generator</title>
<!--
  Builds a Claude skill for the book's notes inbox.

  Everything happens in this page. The zip is assembled in JavaScript from the
  values in the form and handed to the browser as a blob: the token is never
  sent anywhere, because there is nowhere to send it -- this is a static file
  on GitHub Pages and there is no server behind it. That is the whole reason
  the generator is a page rather than an endpoint.

  No dependencies. The zip writer below is about eighty lines because a zip of
  small text files, stored uncompressed, is a header, the bytes, a directory
  and an end record. Pulling in a library to avoid writing them would have put
  the first npm dependency into the published site.
-->
<style>
  /* Over the top on purpose. The author asked for explosions, rainbows and
     unicorns, and a tool you enjoy opening is a tool you actually use -- this
     page is the one moment of setting up the note-taker, so it may as well be
     the good moment. Everything here is CSS and one dependency-free script;
     the published site still has no npm in it.

     Every animation is off under `prefers-reduced-motion`, at the bottom. */
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --fg: #1a1a1a; --dim: #5d5b57;
    --line: #ddd9d2; --field: #fff; --accent: #2f6f4f;
    --rainbow: linear-gradient(90deg,
      #ff5f6d, #ffb75e, #f9f871, #6fdc8c, #4fc3f7, #9b7bff, #ff6ec7, #ff5f6d);
    /* The same colours down the page, for the notes' left rule: a 3px slice
       of a horizontal gradient is one colour, which is not a rainbow. */
    --rainbow-v: linear-gradient(180deg,
      #ff5f6d, #ffb75e, #f9f871, #6fdc8c, #4fc3f7, #9b7bff, #ff6ec7);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a; --fg: #e8e6e1; --dim: #9a968f;
      --line: #33313a; --field: #1e1d24; --accent: #6fbf90;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 ui-serif, "Libertinus Serif", Georgia, serif;
    padding: 3rem 1.25rem 6rem;
    overflow-x: hidden;
  }

  /* The drifting background. Three soft blobs of colour, well behind
     everything, on long offset loops so they never quite repeat a shape. */
  .sky { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
    filter: blur(70px); opacity: .22; will-change: transform;
  }
  .blob:nth-child(1) { background: #ff6ec7; top: -25vmax; left: -20vmax; animation: drift1 34s ease-in-out infinite; }
  .blob:nth-child(2) { background: #4fc3f7; bottom: -30vmax; right: -25vmax; animation: drift2 41s ease-in-out infinite; }
  .blob:nth-child(3) { background: #f9f871; top: 30vmax; right: -30vmax; animation: drift3 47s ease-in-out infinite; }
  @keyframes drift1 { 50% { transform: translate(18vmax, 12vmax) scale(1.25); } }
  @keyframes drift2 { 50% { transform: translate(-16vmax, -14vmax) scale(1.15); } }
  @keyframes drift3 { 50% { transform: translate(-22vmax, 8vmax) scale(.85); } }

  main { max-width: 40rem; margin: 0 auto; position: relative; }

  /* The title cycles a rainbow through its own letterforms. `background-clip:
     text` paints the gradient and the transparent fill lets it through. */
  h1 {
    font-size: clamp(2.6rem, 13vw, 4rem); margin: 0 0 2rem; line-height: 1;
    letter-spacing: -.02em; text-transform: lowercase;
    background: var(--rainbow); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 5s linear infinite, wobble 4s ease-in-out infinite;
  }
  @keyframes rainbow { to { background-position: 300% 0; } }
  @keyframes wobble {
    25% { transform: rotate(-2deg) scale(1.03); }
    75% { transform: rotate(2deg) scale(.98); }
  }

  /* A parade, forever, because why not. Fixed and behind the form so they
     cross the whole screen rather than a column of it. */
  .parade { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .parade i {
    position: absolute; left: -3rem; font-style: normal;
    animation: gallop linear infinite;
  }
  .parade i:nth-child(1) { top: 12%; font-size: 3rem; animation-duration: 17s; }
  .parade i:nth-child(2) { top: 47%; font-size: 1.7rem; animation-duration: 26s; animation-delay: -9s; opacity: .8; }
  .parade i:nth-child(3) { top: 78%; font-size: 4.2rem; animation-duration: 34s; animation-delay: -20s; opacity: .55; }
  @keyframes gallop {
    0%   { transform: translateX(0) translateY(0) rotate(-6deg); }
    25%  { transform: translateX(30vw) translateY(-22px) rotate(7deg); }
    50%  { transform: translateX(60vw) translateY(0) rotate(-6deg); }
    75%  { transform: translateX(90vw) translateY(-22px) rotate(7deg); }
    100% { transform: translateX(115vw) translateY(0) rotate(-6deg); }
  }

  label { display: block; margin: 1.5rem 0 .4rem; font-weight: 700; font-size: 1.1rem; }
  .hint { color: var(--accent); font-size: .8rem; font-weight: 600; }
  input, textarea {
    width: 100%; padding: .6rem .7rem; font: inherit; font-size: .95rem;
    background: var(--field); color: var(--fg);
    border: 1px solid var(--line); border-radius: .5rem;
    transition: box-shadow .25s, border-color .25s, transform .25s;
  }
  /* A field in use gets its own little rainbow and lifts off the page. */
  input:focus, textarea:focus {
    outline: none; border-color: transparent; transform: translateY(-2px);
    box-shadow: 0 0 0 2.5px #ff6ec7, 0 0 0 5px #4fc3f7, 0 6px 22px -6px #9b7bff;
    animation: nudge .45s ease;
  }
  @keyframes nudge { 40% { transform: translateY(-4px) rotate(-.35deg); } }
  #endpoint { font-size: .74rem; }
  code, .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: .9em; }

  /* The button is the whole point of the page, so it behaves like it. */
  button {
    position: relative; margin-top: 2.5rem; padding: 1.1rem 2.4rem; width: 100%;
    font: inherit; font-weight: 800; font-size: 1.5rem; letter-spacing: .02em;
    background: var(--rainbow); background-size: 300% 100%;
    color: #17161c; text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
    border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 26px -10px #9b7bff;
    animation: rainbow 6s linear infinite, breathe 2.6s ease-in-out infinite;
    transition: transform .18s;
  }
  @keyframes breathe { 50% { box-shadow: 0 12px 34px -8px #ff6ec7; } }
  button:hover, button:focus-visible { transform: scale(1.06) rotate(-1.2deg); }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .45; cursor: not-allowed; animation: none; }

  .small { color: var(--dim); font-size: .85rem; margin-top: 2.5rem; }
  summary { cursor: pointer; font-weight: 600; color: var(--fg); }
  details[open] summary { margin-bottom: .5rem; }
  #status { margin-top: .75rem; min-height: 1.5em; font-size: .92rem; }
  #status.bad { color: #c0392b; }
  #status.good { color: var(--accent); font-weight: 600; }
  a { color: inherit; }

  /* One particle of the burst. The script hands each one an angle, a
     distance and a spin; the keyframes only have to fling it there. */
  .spark {
    position: fixed; z-index: 9; pointer-events: none; user-select: none;
    font-size: 1.6rem; left: 0; top: 0;
    animation: fling var(--life) cubic-bezier(.2, .7, .3, 1) forwards;
  }
  @keyframes fling {
    0%   { transform: translate(var(--x0), var(--y0)) scale(.2) rotate(0deg); opacity: 1; }
    70%  { opacity: 1; }
    100% {
      transform: translate(calc(var(--x0) + var(--dx)), calc(var(--y0) + var(--dy)))
                 scale(1.3) rotate(var(--spin));
      opacity: 0;
    }
  }

  /* The flash behind the explosion. */
  .flash {
    position: fixed; inset: 0; z-index: 8; pointer-events: none;
    background: var(--rainbow); background-size: 200% 100%;
    animation: flash .7s ease-out forwards;
  }
  @keyframes flash { 0% { opacity: .5; } 100% { opacity: 0; } }

  /* Nothing above is load-bearing, so under a reduced-motion preference it
     all stops and the page is the plain form it was. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    h1 { color: var(--fg); }
    .sky { display: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div>
<div class="parade" aria-hidden="true"><i>🦄</i><i>🦄</i><i>🦄</i></div>
<main>
  <h1>skill&nbsp;maker</h1>

  <form id="form">
    <label for="endpoint">🌈 inbox <span class="hint" id="endpoint-hint"></span></label>
    <input id="endpoint" class="mono" type="url" required spellcheck="false"
           placeholder="https://notes-intake.you.workers.dev" autocomplete="off">

    <label for="token">🔑 token</label>
    <input id="token" class="mono" type="password" required spellcheck="false"
           placeholder="NOTES_INTAKE_TOKEN" autocomplete="off">

    <label for="book">📚 about</label>
    <input id="book" type="text" value="a book about software, written in Typst"
           autocomplete="off">

    <button id="go" type="submit">MAKE IT ✨</button>
    <p id="status" role="status"></p>
  </form>

  <details class="small">
    <summary>🔒 safe?</summary>
    The zip is built in your browser and goes nowhere else — this page is a
    static file with no server behind it. But the token is written into the
    zip, so anyone holding it can file notes. Treat it as a credential.
  </details>

  <p class="small"><a href="../">📖 the book</a></p>
</main>

<script id="builder">
"use strict";

// --- the skill ------------------------------------------------------------

function skillMarkdown({ endpoint, token, book }) {
  return `---
name: file-note
description: >-
  File a note to the book's notes inbox. Use when the author says to save,
  keep, file or send something, and when a session that produced material
  worth keeping is ending with none of it filed.
  The book is ${book}.
---

# Filing a note to the book

The author thinks out loud here. The book is written elsewhere, by a fleet of
agents that read \`notes/\`. This skill is the hand-off between the two.

## What a note is

**Raw material, not writing.** Send what was actually said and thought,
including the parts that contradict each other. Do not tidy it into an
argument, do not resolve the contradictions, and do not decide what the book
should do about it -- that is the fleet's job, and thinking that has already
been concluded for it is worth less than the thinking that produced it.

If the session produced something separate -- a document, a file, a page, a
transcript -- that is the note. Get its content by whatever means this session
has, and send that. Markdown. 512 KB per note; split anything longer.

**Ask before filing anything the author did not ask you to file.** A note is
public and permanent: it lands in a public repository, on a branch that merges
without anyone reading it, and \`notes/\` is never edited afterwards. When they
said to save it, save it. When you are the one who noticed the session is
ending, ask.

## How

\`\`\`
POST ${endpoint}/note
Authorization: Bearer ${token}
Content-Type: application/json

{
  "title": "Session 02 — what a machine is",
  "body": "# Heading\\n\\nThe note, verbatim.\\n",
  "source": "where this came from, so a reader can trace it"
}
\`\`\`

\`title\` and \`body\` are required. \`source\` is free text.

\`201\` is filed, and the reply names the path -- tell the author. \`200\` with
\`"created": false\` means that exact note is already filed, so retrying is
safe. \`401\` is the wrong token: stop, and say so. Read any other reply
before deciding whether to retry.

Do not paste the token back into the conversation.

The note lands verbatim on a branch of the book's repository and a pull
request opens; \`notes/\` is never edited by anyone. What the book does about
it is decided later, by the fleet, and is neither yours nor the author's to
settle here.
`;
}

// --- a zip ----------------------------------------------------------------
//
// Stored (uncompressed) entries only. For a few kilobytes of Markdown the
// saving from deflate is not worth an implementation, and every unzip
// understands stored.

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n += 1) {
    let c = n;
    for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i += 1) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function dosTime(date) {
  const time = ((date.getHours() & 31) << 11) | ((date.getMinutes() & 63) << 5)
    | ((date.getSeconds() / 2) & 31);
  const day = (((date.getFullYear() - 1980) & 127) << 9)
    | (((date.getMonth() + 1) & 15) << 5) | (date.getDate() & 31);
  return { time, day };
}

function zip(files) {
  const encoder = new TextEncoder();
  const now = dosTime(new Date());
  const chunks = [];
  const directory = [];
  let offset = 0;

  const push = (bytes) => { chunks.push(bytes); offset += bytes.length; };

  for (const [name, text] of Object.entries(files)) {
    const nameBytes = encoder.encode(name);
    const data = encoder.encode(text);
    const sum = crc32(data);

    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true); // names are UTF-8
    local.setUint16(8, 0, true);      // stored
    local.setUint16(10, now.time, true);
    local.setUint16(12, now.day, true);
    local.setUint32(14, sum, true);
    local.setUint32(18, data.length, true);
    local.setUint32(22, data.length, true);
    local.setUint16(26, nameBytes.length, true);
    local.setUint16(28, 0, true);

    directory.push({ nameBytes, sum, size: data.length, offset });
    push(new Uint8Array(local.buffer));
    push(nameBytes);
    push(data);
  }

  const directoryStart = offset;
  for (const entry of directory) {
    const central = new DataView(new ArrayBuffer(46));
    central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    central.setUint16(6, 20, true);
    central.setUint16(8, 0x0800, true);
    central.setUint16(10, 0, true);
    central.setUint16(12, now.time, true);
    central.setUint16(14, now.day, true);
    central.setUint32(16, entry.sum, true);
    central.setUint32(20, entry.size, true);
    central.setUint32(24, entry.size, true);
    central.setUint16(28, entry.nameBytes.length, true);
    central.setUint16(30, 0, true);
    central.setUint16(32, 0, true);
    central.setUint16(34, 0, true);
    central.setUint16(36, 0, true);
    central.setUint32(38, 0, true);
    central.setUint32(42, entry.offset, true);
    push(new Uint8Array(central.buffer));
    push(entry.nameBytes);
  }

  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(4, 0, true);
  end.setUint16(6, 0, true);
  end.setUint16(8, directory.length, true);
  end.setUint16(10, directory.length, true);
  end.setUint32(12, offset - directoryStart, true);
  end.setUint32(16, directoryStart, true);
  end.setUint16(20, 0, true);
  push(new Uint8Array(end.buffer));

  return new Blob(chunks, { type: "application/zip" });
}

// Exported for `tools/check_skill_page.py`, which runs this script under
// node. `typeof module` is "undefined" in a browser, so this is inert there;
// under CommonJS `module` is a local binding in the wrapper rather than a
// property of the global, which is why it is tested bare.
if (typeof module === "object" && module && module.exports) {
  module.exports = { zip, crc32, skillMarkdown };
}

// --- the page -------------------------------------------------------------

// Guarded so the file is testable as written: `tools/check_skill_page.py`
// pulls this script out and runs it under node, where there is no document.
// Testing a copy of the zip writer would be testing the wrong thing.
const form = typeof document === "undefined" ? null : document.getElementById("form");
const status = form && document.getElementById("status");

// The address is not in the repository: `worker-deploy.yml` reads the
// account's subdomain from Cloudflare at deploy time, because a copy checked
// in here would keep looking right after the account changed. So the deploy
// links to this page with `?inbox=` already filled, and the value arrives from
// the run that did the deploying. Typing it by hand still works.
if (form) {
  const given = new URLSearchParams(location.search).get("inbox");
  if (given && /^https:\/\//.test(given)) {
    document.getElementById("endpoint").value = given.trim().replace(/\/+$/, "");
    // The hint below the field explains where the address comes from, which
    // is a question the reader no longer has once it is in the box. Saying
    // who filled it is the useful thing at that point.
    document.getElementById("endpoint-hint").textContent = "✅ from your deploy";
  }
}

if (form) form.addEventListener("submit", (event) => {
  event.preventDefault();
  status.className = "";
  status.textContent = "";

  const endpoint = document.getElementById("endpoint").value.trim().replace(/\/+$/, "");
  const token = document.getElementById("token").value.trim();
  const book = document.getElementById("book").value.trim() || "a book";

  if (!/^https:\/\//.test(endpoint)) {
    status.className = "bad";
    status.textContent = "🙅 https only";
    return;
  }
  if (token.length < 16) {
    status.className = "bad";
    status.textContent = "🤏 that token is too short";
    return;
  }

  const blob = zip({ "file-note/SKILL.md": skillMarkdown({ endpoint, token, book }) });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "file-note-skill.zip";
  document.body.appendChild(link);
  link.click();
  link.remove();
  // Revoked on the next tick: the download has the blob by then, and holding
  // the URL keeps the token alive in the page longer than it needs to be.
  setTimeout(() => URL.revokeObjectURL(url), 0);

  status.className = "good";
  status.textContent = "🎉 got it — drop the zip in your session";
  if (window.party) window.party(document.getElementById("go"));
});
</script>

<!--
  Decoration only. It is a second block on purpose: `check_skill_page.py` and
  `make_skill.py` pull the builder out by its id and run it under node, where
  there is no DOM and none of this would mean anything. Keep anything that
  touches the page down here.
-->
<script id="confetti">
"use strict";

// The explosion. `window.party(el)` throws a handful of emoji out of an
// element's centre and flashes a rainbow behind them.
//
// Fixed positioning and viewport coordinates rather than an absolutely
// positioned container: the button can be anywhere down a scrolled page, and
// `getBoundingClientRect` already answers in the space `position: fixed`
// uses. The particles remove themselves on `animationend` so a page left open
// through twenty downloads does not accumulate two hundred dead spans.
(function () {
  const CAST = ["🎉", "✨", "🌈", "💥", "🦄", "⭐", "🎊", "💫", "🩷", "🍀"];
  const QUIET = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");

  window.party = function (origin, count) {
    if (QUIET && QUIET.matches) return;

    const box = origin.getBoundingClientRect();
    const x0 = box.left + box.width / 2;
    const y0 = box.top + box.height / 2;

    const flash = document.createElement("div");
    flash.className = "flash";
    flash.addEventListener("animationend", () => flash.remove());
    document.body.appendChild(flash);

    for (let i = 0; i < (count || 34); i++) {
      const spark = document.createElement("span");
      spark.className = "spark";
      spark.textContent = CAST[Math.floor(Math.random() * CAST.length)];

      // Fired upward more often than down, because confetti that only falls
      // reads as a leak rather than a celebration.
      const angle = Math.PI * (1.15 + Math.random() * 0.7) + (Math.random() < 0.25 ? Math.PI : 0);
      const reach = 90 + Math.random() * 260;

      spark.style.setProperty("--x0", x0 + "px");
      spark.style.setProperty("--y0", y0 + "px");
      spark.style.setProperty("--dx", Math.cos(angle) * reach + "px");
      spark.style.setProperty("--dy", Math.sin(angle) * reach + "px");
      spark.style.setProperty("--spin", Math.round(Math.random() * 900 - 450) + "deg");
      spark.style.setProperty("--life", (0.9 + Math.random() * 0.8).toFixed(2) + "s");

      spark.addEventListener("animationend", () => spark.remove());
      document.body.appendChild(spark);
    }
  };

  // A small hello on arrival, from the title rather than the button, so the
  // two bursts do not look like the same event.
  window.addEventListener("load", () => {
    const h1 = document.querySelector("h1");
    if (h1) setTimeout(() => window.party(h1, 12), 250);
  });

  // And a ping off each field as it stops being empty. Once per field: a
  // spark on every keystroke of a forty-character token is a strobe.
  document.querySelectorAll("input").forEach((field) => {
    let fired = field.value !== "";
    field.addEventListener("input", () => {
      if (!fired && field.value !== "") {
        fired = true;
        window.party(field, 6);
      } else if (field.value === "") {
        fired = false;
      }
    });
  });
})();
</script>
</body>
</html>
