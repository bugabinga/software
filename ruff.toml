# Lint and format rules for `tools/`.
#
# The selection is wide on purpose -- the alternative to a strict linter is
# `pr-reviewer` spending a model call on an unused import. What is switched
# off below is switched off for a reason, and each reason is a fact about this
# repository rather than a preference.

line-length = 88

[format]
# Armed rather than in use: nothing in `tools/` has a `>>>` or a fenced
# Python block in a docstring today, so this formats nothing. It is here so
# that the first doctest somebody writes is formatted like the rest of the
# tree instead of starting a second style. The `$`-prefixed shell in every
# `Usage:` section is not Python and is not touched.
docstring-code-format = true

[lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # import order
  "UP", # pyupgrade -- the floor is 3.11, so say so
  "B", # bugbear
  "BLE", # blind `except Exception`
  "SIM", # simplify
  "C4", # comprehensions
  "RET", # returns
  "PTH", # pathlib over os.path
  "ARG", # unused arguments
  "N", # naming
  "RUF", # ruff's own
  "PL", # pylint
]

ignore = [
  # Complexity and magic values, and this is the whole of what is switched
  # off here. Recounted 2026-09-15: 9 PLR0912, 4 PLR0915, 2 PLR0913,
  # 3 PLR0911, 18 PLR2004 -- 36, against the 26 recorded before. The line
  # asking for a recount is the reason this is right rather than assumed.
  #
  # The growth is not decay. PLR2004 went 11 -> 18 and every new one is a
  # literal in a test case, where `assertEqual(round_of(...), 2)` is the
  # assertion and naming the 2 would hide it. The complexity counters sit on
  # `tools/build.py`, a pipeline whose honest shape is one long function
  # doing the steps in order; splitting it to satisfy a counter would make it
  # harder to read.
  #
  # Recount before adding to this list. A count that grows outside a
  # `unittest.TestCase` is the signal that the exception has stopped being
  # one.
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
]
