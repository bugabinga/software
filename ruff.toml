# Lint and format rules for `tools/`.
#
# The selection is wide on purpose -- the alternative to a strict linter is
# `pr-reviewer` spending a model call on an unused import. What is switched
# off below is switched off for a reason, and each reason is a fact about this
# repository rather than a preference.

line-length = 88

[format]
docstring-code-format = true

[lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # import order
  "UP", # pyupgrade -- the floor is 3.11, so say so
  "B", # bugbear
  "BLE", # blind `except Exception`
  "SIM", # simplify
  "C4", # comprehensions
  "RET", # returns
  "PTH", # pathlib over os.path
  "ARG", # unused arguments
  "N", # naming
  "RUF", # ruff's own
  "PL", # pylint
]

ignore = [
  # Complexity and magic values, and this is the whole of what is switched
  # off here: 8 PLR0912, 4 PLR0915, 2 PLR0913, 1 PLR0911, 11 PLR2004. None of
  # them is a defect -- they are thresholds, and `tools/build.py` is a
  # pipeline whose honest shape is one long function doing the steps in
  # order. Splitting it to satisfy a counter would make it harder to read.
  # Recount before adding to this list; a growing number here is the signal
  # that the exception has stopped being an exception.
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
]
