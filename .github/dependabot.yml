version: 2

# What Dependabot can watch here, and what it cannot.
#
# This repository has no package manifest -- the tools are Python's standard
# library, a Typst binary, a gh binary and a typos binary, each pinned by
# version in a file. Dependabot understands none of those, so it covers the
# GitHub Actions and `maintenance.yml` covers the pinned binaries. Between
# them nothing in the scaffolding goes unwatched.
#
# Every action is pinned to a commit rather than a tag, so what Dependabot
# proposes is a new commit and the version in the trailing comment. A tag is
# mutable: `v2` can be moved onto a different commit by whoever owns the
# action, and this repository runs those actions with a token that can write
# to it.

updates:
  # Every `uses:`, in the workflows and in the composite actions.
  #
  # Two directories, and the second is not optional: `/` covers
  # `.github/workflows/` and an `action.yml` in the repository root -- not one
  # nested under `.github/actions/`. Nothing said so, and the evidence was
  # sitting in the tree: the composite action was still on `actions/cache@v4`
  # while every workflow had been moved to v6, because Dependabot had never
  # once looked at it.
  #
  # Weekly rather than monthly: a workflow is the one thing here that can
  # break without anyone touching the book, and the bumps are small enough to
  # read.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci:"
    labels:
      - chore
    groups:
      # One pull request for all of them. These actions move together, they
      # are read together, and five separate pull requests for five bumps is
      # how a repository teaches its author to stop reading them.
      actions:
        patterns:
          - "*"
