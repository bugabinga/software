name: Worker deploy

# Deploys the notes inbox to Cloudflare.
#
# The inbox is how the author's note-taking agent hands material to the book:
# it POSTs a note, the Worker writes it to a branch, and the fleet takes it
# from there. See `worker/notes-intake/src/index.js` for why a Worker rather
# than giving that agent a GitHub token.
#
# ## The npm in the room
#
# This repository has no package manager -- the tools are Python's standard
# library and pinned binaries, and wrangler is one of them: `mise.toml`.
# Two workflows run it, this one and `preview.yml`, and nothing else:
# nothing a contributor runs needs node, `mise run check` does not, and the
# Worker itself is one file of plain JavaScript with no dependencies.
# Hand-rolling the script-upload API instead would have kept
# npm out entirely, at the cost of writing an untestable multipart request
# against an API this session cannot reach. Wrangler is the supported path and
# it is pinned exactly, which is the same bargain as `.typst-version`.
#
# ## Sequencing
#
# Deploys only from `main`, and only when the Worker changes. The Worker's own
# secrets are set on every deploy from repository secrets, because
# `wrangler secret put` is itself a deployment and doing it here means the
# secret in GitHub is the one in Cloudflare rather than something somebody set
# by hand once.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the notes inbox
    # The Cloudflare credential is an environment secret, and this environment
    # is restricted to `main`. A deploy from a branch would be a stranger's
    # Worker on the author's account.
    environment: Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # wrangler comes from `mise.toml` like every other pinned tool. It used
      # to be `npx --yes wrangler@$WRANGLER_VERSION` against a version pinned
      # in this file's `env:` -- a second pin of a version the manifest
      # already held, free to drift from it, and the last `npx` in the tree.
      # Narrowed, because the default is `mise install` over the whole
      # manifest -- typst, lychee, biome, ty, actionlint -- to run one tool.
      # `ci.yml` already refuses a second mise-action step for the same
      # reason; this is the same money.
      #
      # `node` is named as well as `wrangler`, and must be: wrangler is an
      # npm-backed tool, so mise refuses it with "requires configured install
      # dependency 'node@26.8.2', but its selected version is not installed".
      # Naming only wrangler is what broke run 34716781035 on the merge that
      # introduced this line.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: node wrangler

      # The Worker is testable without Cloudflare, without wrangler and
      # without a credential, so there is no excuse for deploying it
      # untested. Twenty-two cases, including the ones that matter: a wrong
      # token, a traversal in the title, and a retry.
      - name: Test the worker
        run: node worker/notes-intake/test.mjs

      - name: Is there a credential to deploy with
        id: key
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -n "${TOKEN:-}" ] && [ -n "${ACCOUNT:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare credential, so nothing was deployed. The worker is tested and unchanged in Cloudflare. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the Cloudflare environment to arm it."
          fi

      # Asked before deploying, because every run of this workflow since it
      # was armed has died at the deploy with "You can either deploy your
      # worker to one or more routes ... or register a workers.dev
      # subdomain" -- a red job and a wall of wrangler output instead of the
      # one sentence that fixes it. The notes inbox has therefore never
      # actually deployed.
      - name: Does the account have a workers.dev subdomain
        id: subdomain
        if: steps.key.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          # `tools/cloudflare.py` tells three situations apart that wrangler
          # reports as one: a subdomain that exists, a token that cannot read
          # it, and an account that has none. The last diagnosis here went
          # after the wrong one -- the account has `software-fleet.workers.dev`
          # and wrangler still said to register a subdomain, which is what a
          # scope problem looks like from outside.
          status=$(curl -sS -o /tmp/subdomain.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            || echo 000)
          if name=$(python3 tools/cloudflare.py --subdomain --status "$status" \
                      < /tmp/subdomain.json 2> /tmp/subdomain.why); then
            echo "present=true" >> "$GITHUB_OUTPUT"
            # Carried out of the step because it is the one place the real
            # address is known: nothing in the repository records which
            # account this is, deliberately, so a checked-in copy cannot go
            # stale against it.
            echo "name=${name}" >> "$GITHUB_OUTPUT"
            echo "::notice::deploying to ${name}.workers.dev"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$(cat /tmp/subdomain.why) Nothing was deployed."
          fi

      - name: Check what would be deployed
        if: steps.key.outputs.present == 'true'
        working-directory: worker/notes-intake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise exec -- wrangler deploy --dry-run

      - name: Deploy
        if: steps.subdomain.outputs.present == 'true'
        working-directory: worker/notes-intake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise exec -- wrangler deploy

      # Piped on stdin, never as an argument: an argument is in the process
      # table and in the log of anything that traces the runner.
      - name: Set the worker's secrets
        if: steps.subdomain.outputs.present == 'true'
        working-directory: worker/notes-intake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTAKE_TOKEN: ${{ secrets.NOTES_INTAKE_TOKEN }}
          NOTES_GITHUB_TOKEN: ${{ secrets.NOTES_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${INTAKE_TOKEN:-}" ] || missing="$missing NOTES_INTAKE_TOKEN"
          [ -n "${NOTES_GITHUB_TOKEN:-}" ] || missing="$missing NOTES_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::warning::Deployed, but these secrets are not set, so the inbox will refuse every note:$missing"
            exit 0
          fi
          printf '%s' "$INTAKE_TOKEN" \
            | mise exec -- wrangler secret put INTAKE_TOKEN
          printf '%s' "$NOTES_GITHUB_TOKEN" \
            | mise exec -- wrangler secret put GITHUB_TOKEN
          echo "::notice::secrets set from repository secrets"

      # Asked for rather than assembled here, so the worker's name stays in
      # `wrangler.jsonc` alone. A copy in this file would be a second place to
      # get it wrong, and the deploy above is the thing that would keep
      # working while the summary pointed somewhere that does not exist.
      - name: The inbox's address
        id: inbox
        if: steps.subdomain.outputs.present == 'true'
        env:
          SUBDOMAIN: ${{ steps.subdomain.outputs.name }}
        run: |
          set -euo pipefail
          url=$(python3 tools/make_skill.py --subdomain "$SUBDOMAIN" --print-endpoint)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Say where it is
        # The same condition as the two steps it reports on. Gated on the
        # credential alone, it wrote "Notes inbox deployed" whenever the
        # subdomain check had stopped the deploy -- one inaccurate sentence
        # in place of the red wall, which is not the trade that was wanted.
        if: steps.subdomain.outputs.present == 'true'
        env:
          INBOX: ${{ steps.inbox.outputs.url }}
          PAGES: https://bugabinga.github.io/software
        run: |
          {
            echo "### Notes inbox deployed"
            echo
            echo "The note-taker POSTs to \`$INBOX/note\`. See \`docs/NOTES-INBOX.md\`."
            echo
            # The generator, with the address filled in. The token is typed
            # there and not carried here: this repository is public, so a
            # workflow artifact holding one would publish it, and a stranger
            # who files a note gets it merged without anyone reading it.
            echo "The note-taker's skill: [generate it]($PAGES/skill/?inbox=$INBOX),"
            # shellcheck disable=SC2016  # backticks are markdown here.
            echo 'or run `tools/make_skill.py` if you have a checkout.'
          } >> "$GITHUB_STEP_SUMMARY"
