name: Notes reindex

# Keeps `notes/index.md` true when a note arrives through the inbox.
#
# `tools/ingest_notes.py --reindex` generates that file, and a note filed by
# the Cloudflare Worker skips it: the Worker writes one file and stops, which
# is the right amount for a Worker to do. So the index is rebuilt here, on the
# branch, before anything reviews or merges it -- rather than left to drift
# until somebody notices the table is short a row.
#
# Only `agent/note-**`, which is the namespace the inbox uses. An agent that
# adds a note by hand runs the reindex itself; this is for the one caller that
# cannot.

on:
  push:
    branches:
      - "agent/note-**"

permissions:
  contents: write

concurrency:
  group: notes-reindex-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  reindex:
    name: Rebuild the notes index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Rebuild it
        run: python3 tools/ingest_notes.py --reindex

      - name: Commit it if it moved
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- notes/index.md; then
            echo "::notice::the index was already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/index.md
          git commit -q -m "Reindex notes after an inbox delivery

          Generated by tools/ingest_notes.py --reindex. The note itself was
          written by the Cloudflare inbox, which writes one file and stops."
          git push -q origin "HEAD:$BRANCH"
          echo "::notice::reindexed and pushed to $BRANCH"
