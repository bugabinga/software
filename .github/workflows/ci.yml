name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Branches the fleet pushes. A pull request opened with the workflow
      # token does not trigger `pull_request` runs, so the push is what gets
      # checked -- and that run is what agent-branches.yml waits for before
      # merging a green chore.
      - "agent/**"
      - "maintenance/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the event as well as the branch, which reads like waste and is
  # not.
  #
  # The group used to be the branch alone, so that a push and a pull request
  # for the same head did not both run. What actually happened is that one
  # cancelled the other, and both produce check runs named `Build`,
  # `Outbound links` and `Spelling` -- the names the ruleset requires. A
  # required check that reads *Canceled* is not a check that passed, and on
  # #59 the pull request showed `CI / Build (push)` as `Required · Canceled
  # after 2s` beside a successful `CI / Build (pull_request)` for the same
  # commit.
  #
  # It did not block that merge, because the successful run was the later
  # one. That is a race, not a design: the day a pull request run finishes
  # first, the cancelled push run is the most recent check of that name and
  # the merge is stuck with no way to satisfy it. Two runs cost a minute;
  # this costs an afternoon.
  #
  # Superseding still works where it matters -- pushing twice to a branch
  # cancels the first run, because those share both event and branch.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # `agent-branches.yml` requires a check run of exactly this name before
    # it will call a branch green. Renaming the job renames the check, and
    # the fleet would then merge nothing at all.
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # For the prose scan's SARIF. Without it the upload fails with a 403
      # that reads like a missing file.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the book
        uses: ./.github/actions/build-book

      - name: Type-check the example code
        run: tools/check_code.sh

      - name: Check the workflow definitions
        run: python3 tools/check_workflows.py

      # The EPUB is generated rather than exported, so nothing else would
      # notice if a change to the page shell made a chapter stop parsing as
      # XML -- and a reader finding out is a reader who cannot open the book.
      - name: Check the EPUB
        run: python3 tools/check_epub.py dist/book.epub

      - name: Check the fleet's briefs
        run: python3 tools/fleet_brief.py --self-test

      # The notes inbox uses only web-standard APIs, so plain node tests it --
      # no wrangler, no Cloudflare, no credential. There is no excuse for an
      # untested worker when the test costs a second.
      - name: Test the notes inbox worker
        run: node worker/notes-intake/test.mjs
      # The generator writes a zip container by hand so the token never
      # leaves the browser. Node runs the shipped script, Python opens what
      # it produced: two runtimes have to agree it is a zip.
      - name: Check the skill generator
        run: python3 tools/check_skill_page.py

      # The review builder's line arithmetic. A comment on the wrong line
      # reads as a finding about code that is fine, which is worse than no
      # comment, and nothing else would catch it.
      - name: Check the review builder
        run: python3 tools/post_review.py --self-test

      # The mechanical half of prose review. SARIF is not a security format --
      # it is findings with a file, a line, a rule and a severity, and GitHub
      # takes it from any tool. What it buys over an agent writing the same
      # thing in prose: the finding lands as an annotation on the line, with a
      # rule id, a dismissal flow, and history.
      #
      # `--fail-on never` because the gate is the ruleset's, not this step's:
      # a warning should annotate and not redden a build.
      - name: Check the prose scanner
        run: python3 tools/prose_scan.py --self-test

      - name: Scan the prose
        run: python3 tools/prose_scan.py --sarif build/prose.sarif --fail-on never

      - name: Upload what it found
        # Forks get a read-only token no matter what `permissions:` grants
        # (see the preview-comment step below) -- this 403s there.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: build/prose.sarif
          category: prose-scan

      - name: Upload the built book
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: book-site
          path: dist
          retention-days: 14

      # A preview of every pull request, without needing a second host: the
      # artifact is the built site, downloadable from the run. Forks get a
      # read-only token, so a failure to comment must not fail the build --
      # the job summary carries the same information.
      - name: Comment the preview on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execSync } = require("child_process");
            const summary = execSync("python3 tools/summary.py dist").toString();
            const marker = "<!-- book-preview -->";
            const body = [
              marker,
              "## 📖 Book preview",
              "",
              `Built from ${context.sha.slice(0, 7)}.`,
              "",
              `**[Download the built site](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts)**`,
              " — unzip and open `index.html`, or run `make serve` locally.",
              "",
              summary,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    env:
      TYPOS_VERSION: 1.36.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install typos
        run: |
          set -euo pipefail
          archive="typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" | tar -xz ./typos
          sudo install -m 755 typos /usr/local/bin/typos

      - name: Check spelling
        run: typos

  external-links:
    name: Outbound links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the built book
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: book-site
          path: dist

      - name: Restore the lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      # Self-canonical links, og:url and every sitemap entry point at the
      # site being built, and cannot resolve before its first deployment.
      # Reading the URL out of the build keeps it out of lychee.toml.
      - name: Work out the site's own URL
        id: site
        run: |
          set -euo pipefail
          pattern=$(python3 -c 'import json, re; base = json.load(open("dist/build-info.json")).get("base_url", ""); print("^" + re.escape(base) if base else "^https://never.invalid/")')
          echo "exclude=$pattern" >> "$GITHUB_OUTPUT"
          echo "::notice::excluding $pattern from the outbound link check"

      - name: Check outbound links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config lychee.toml --cache --max-cache-age 1d
            --exclude "${{ steps.site.outputs.exclude }}" dist
          fail: true
