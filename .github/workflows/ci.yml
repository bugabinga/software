name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Branches the fleet pushes. A pull request opened with the workflow
      # token does not trigger `pull_request` runs, so the push is what gets
      # checked -- and that run is what agent-branches.yml waits for before
      # merging a green chore.
      - "agent/**"
      - "maintenance/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the event as well as the branch, which reads like waste and is
  # not.
  #
  # The group used to be the branch alone, so that a push and a pull request
  # for the same head did not both run. What actually happened is that one
  # cancelled the other, and both produce check runs named `Build`,
  # `Outbound links` and `Spelling` -- the names the ruleset requires. A
  # required check that reads *Canceled* is not a check that passed, and on
  # #59 the pull request showed `CI / Build (push)` as `Required · Canceled
  # after 2s` beside a successful `CI / Build (pull_request)` for the same
  # commit.
  #
  # It did not block that merge, because the successful run was the later
  # one. That is a race, not a design: the day a pull request run finishes
  # first, the cancelled push run is the most recent check of that name and
  # the merge is stuck with no way to satisfy it. Two runs cost a minute;
  # this costs an afternoon.
  #
  # Superseding still works where it matters -- pushing twice to a branch
  # cancels the first run, because those share both event and branch.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    # One job, and the reason is billing rather than tidiness.
    #
    # This used to be three -- Build, Spelling, Outbound links -- running in
    # parallel. Measured on one push: nine jobs across all workflows, 131
    # seconds of actual work, nine minutes billed, because GitHub rounds every
    # job up to the whole minute. The three CI jobs were 21s, 17s and 12s of
    # which roughly five seconds each was runner setup and checkout. Parallel
    # saved perhaps fifteen seconds of wall clock and cost two minutes.
    #
    # It also deletes the artifact round-trip: the link check used to download
    # the site that the build had just uploaded from the same commit.
    #
    # The check is now named `CI`, so the ruleset's required checks change
    # from three names to one. That is the rule change this depends on.
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # For the prose scan's SARIF. Without it the upload fails with a 403
      # that reads like a missing file.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No `mise-action` step here on purpose. `build-book` runs one as its
      # own first step, and every later step in this job uses the toolchain
      # it leaves behind. A second one before it was a whole extra setup and
      # cache restore on the job that runs for every push and every pull
      # request, to install what the next step installs anyway.
      #
      # `maintenance.yml` still needs its own, because it reads the pins
      # before it builds anything.
      - name: Build the book
        uses: ./.github/actions/build-book

      # One line, and it is the same line a contributor runs. The gates live
      # in mise.toml; CI restating each command in its own `run:` block is
      # how the two definitions drifted apart before.
      #
      # `build-strict` runs inside it, so the build above is the artifact
      # build and this is the checking build. They are cheap enough -- two
      # seconds each -- that sharing one would cost more in indirection.
      - name: Check
        run: mise run check

      - name: Check spelling
        run: mise run check-spelling

      - name: Restore the lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      # Self-canonical links, og:url and every sitemap entry point at the
      # site being built, and cannot resolve before its first deployment.
      # Reading the URL out of the build keeps it out of lychee.toml.
      - name: Work out the site's own URL
        id: site
        run: |
          set -euo pipefail
          pattern=$(python3 -c 'import json, re; base = json.load(open("dist/build-info.json")).get("base_url", ""); print("^" + re.escape(base) if base else "^https://never.invalid/")')
          echo "exclude=$pattern" >> "$GITHUB_OUTPUT"
          echo "::notice::excluding $pattern from the outbound link check"

      # The mechanical half of prose review. SARIF is not a security format --
      # it is findings with a file, a line, a rule and a severity, and GitHub
      # takes it from any tool. What it buys over an agent writing the same
      # thing in prose: the finding lands as an annotation on the line, with a
      # rule id, a dismissal flow, and history.
      #
      # `--fail-on error` -- the default -- so a dead note or a dead xref
      # reddens the build. It was `never` on the theory that the ruleset
      # would gate on code-scanning results, and the ruleset never did:
      # required checks is `CI` alone, so `never` meant an error-level
      # finding blocked nothing at all. Warnings still only annotate.
      - name: Scan the prose
        run: python3 tools/prose_scan.py --sarif build/prose.sarif

      - name: Upload what it found
        # `always()` so the annotations still land on the diff when the step
        # above just failed -- which is exactly when they are worth reading.
        if: always()
        # Forks get a read-only token no matter what `permissions:` grants
        # (see the preview-comment step below) -- this 403s there.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          sarif_file: build/prose.sarif
          category: prose-scan

      - name: Check outbound links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config lychee.toml --cache --max-cache-age 1d
            --exclude "${{ steps.site.outputs.exclude }}" dist
          fail: true

      - name: Upload the built book
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: book-site
          path: dist
          retention-days: 14

      # The built site, attached to the run and summarised here. This is the
      # fallback and the record; the readable preview is a URL, posted by
      # `preview.yml` after this run finishes. Forks get a read-only token,
      # so a failure to comment must not fail the build -- the job summary
      # carries the same information.
      - name: Comment the preview on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execSync } = require("child_process");
            const summary = execSync("python3 tools/summary.py dist").toString();
            const marker = "<!-- book-preview -->";
            const body = [
              marker,
              "## 📖 What this build contains",
              "",
              `Built from ${context.sha.slice(0, 7)}. This is the record; where`,
              "`preview.yml` can deploy one, a readable link follows in its own",
              "comment.",
              "",
              summary,
              "",
              `<sub>[Download the built site](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts) — unzip and open \`index.html\`, or run \`mise run serve\` locally.</sub>`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
