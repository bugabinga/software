name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Branches the fleet pushes. A pull request opened with the workflow
      # token does not trigger `pull_request` runs, so the push is what gets
      # checked -- and that run is what agent-branches.yml waits for before
      # merging a green chore.
      - "agent/**"
      - "maintenance/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the event as well as the branch, which reads like waste and is
  # not.
  #
  # The group used to be the branch alone, so that a push and a pull request
  # for the same head did not both run. What actually happened is that one
  # cancelled the other, and both produce a check run named `CI` -- the name
  # the ruleset requires (`repo.toml`). A required check that reads *Canceled*
  # is not a check that passed, and on #59, when this was still three jobs,
  # the pull request showed `CI / Build (push)` as `Required · Canceled after
  # 2s` beside a successful `CI / Build (pull_request)` for the same commit.
  #
  # It did not block that merge, because the successful run was the later
  # one. That is a race, not a design: the day a pull request run finishes
  # first, the cancelled push run is the most recent check of that name and
  # the merge is stuck with no way to satisfy it. Two runs cost two slots for
  # a few seconds; this costs an afternoon.
  #
  # Superseding still works where it matters -- pushing twice to a branch
  # cancels the first run, because those share both event and branch.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    # One job, and the reason is concurrency rather than tidiness.
    #
    # This used to be three -- Build, Spelling, Outbound links -- running in
    # parallel. Measured on one push: nine jobs across all workflows, 131
    # seconds of actual work. Nothing here is billed -- the repository is
    # public -- and the per-job round-up to a whole minute is a billing rule,
    # so it is not what the author's other repositories queue behind: that is
    # the 131 seconds, across nine concurrency slots held to spend it. The
    # three CI jobs were 21s, 17s and 12s, roughly five seconds each of runner
    # setup and checkout. Parallel bought perhaps fifteen seconds of wall
    # clock and paid two extra checkouts and two extra slots for it.
    #
    # It also deletes the artifact round-trip: the link check used to download
    # the site that the build had just uploaded from the same commit.
    #
    # The check is now named `CI`, so the ruleset's required checks change
    # from three names to one. That is the rule change this depends on.
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # No `pull-requests: write`: this job stopped commenting when the
      # preview table moved to the job summary. `preview.yml` posts the one
      # comment a pull request gets, and holds the write itself.
      # `check-settings` asks which commit the last successful `Settings` run
      # applied, to know whether comparing `repo.toml` to the live repository
      # would prove anything. Without this the question is unreadable and the
      # check declines rather than failing -- correct, and useless.
      actions: read
      # For the prose scan's SARIF. Without it the upload fails with a 403
      # that reads like a missing file.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No `mise-action` step here on purpose. `build-book` runs one as its
      # own first step, and every later step in this job uses the toolchain
      # it leaves behind. A second one before it was a whole extra setup and
      # cache restore on the job that runs for every push and every pull
      # request, to install what the next step installs anyway.
      #
      # `maintenance.yml` still needs its own, because it reads the pins
      # before it builds anything.
      - name: Build the book
        uses: ./.github/actions/build-book

      # One line, and it is the same line a contributor runs. The gates live
      # in mise.toml; CI restating each command in its own `run:` block is
      # how the two definitions drifted apart before.
      #
      # `build-strict` runs inside it, so the build above is the artifact
      # build and this is the checking build. They are cheap enough -- two
      # seconds each -- that sharing one would cost more in indirection.
      - name: Check
        env:
          # `check-settings` compares the live repository against `repo.toml`,
          # and without a token every `gh api` call fails, every section reads
          # `unread`, and the task passes having compared nothing. So the
          # token is what arms it, everywhere, on every branch.
          #
          # It was briefly armed on `main` only, because a branch that edits
          # `repo.toml` declares what the repository is *about to* be and
          # `settings.yml` cannot have applied it yet. Withholding the token
          # is the wrong lever for that: it blinds the check on the branches
          # CI runs on most, it cannot reach the agents -- `fleet.yml` and
          # `fleet-respond.yml` hand `github.token` to the step the agent
          # works in -- and on `main` it arms the check exactly where
          # `settings.yml` is running concurrently. `unapplied_reason` in
          # `tools/repo_state.py` does it properly: compare when this file is
          # the file the last successful apply ran from, and say why not
          # otherwise. One answer, true in CI, in an agent and on a laptop.
          GH_TOKEN: ${{ github.token }}
        run: mise run check

      - name: Check spelling
        run: mise run check-spelling

      - name: Restore the lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      # Self-canonical links, og:url and every sitemap entry point at the
      # site being built, and cannot resolve before its first deployment.
      # Reading the URL out of the build keeps it out of lychee.toml.
      - name: Work out the site's own URL
        id: site
        run: |
          set -euo pipefail
          pattern=$(python3 -c 'import json, re; base = json.load(open("dist/build-info.json")).get("base_url", ""); print("^" + re.escape(base) if base else "^https://never.invalid/")')
          echo "exclude=$pattern" >> "$GITHUB_OUTPUT"
          echo "::notice::excluding $pattern from the outbound link check"

      # The mechanical half of prose review. SARIF is not a security format --
      # it is findings with a file, a line, a rule and a severity, and GitHub
      # takes it from any tool. What it buys over an agent writing the same
      # thing in prose: the finding lands as an annotation on the line, with a
      # rule id, a dismissal flow, and history.
      #
      # `--fail-on error` -- the default -- so a dead note or a dead xref
      # reddens the build. It was `never` on the theory that the ruleset
      # would gate on code-scanning results, and the ruleset never did:
      # required checks is `CI` alone, so `never` meant an error-level
      # finding blocked nothing at all. Warnings still only annotate.
      - name: Scan the prose
        run: python3 tools/prose_scan.py --sarif build/prose.sarif

      - name: Upload what it found
        # `always()` so the annotations still land on the diff when the step
        # above just failed -- which is exactly when they are worth reading.
        if: always()
        # Forks get a read-only token no matter what `permissions:` grants
        # -- this 403s there.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: build/prose.sarif
          category: prose-scan

      - name: Check outbound links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config lychee.toml --cache --max-cache-age 1d
            --exclude "${{ steps.site.outputs.exclude }}" dist
          fail: true

      - name: Upload the built book
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: book-site
          path: dist
          retention-days: 14

      # What the build contains, in the job summary rather than a comment.
      # It used to be a pull request comment on every run, which meant two
      # comments on every pull request -- this one and `preview.yml`'s link
      # -- on changes that could not alter a single page of the book. The
      # summary is free, is attached to the run that produced it, and nobody
      # has to scroll past it. The one comment a pull request gets is the
      # link, and only when the built site actually changed; `preview.yml`
      # owns it now and carries this same table inside it.
      - name: Say what the build contains
        if: always() && steps.upload.outcome == 'success'
        run: |
          set -euo pipefail
          {
            echo "## 📖 What this build contains"
            echo
            python3 tools/summary.py dist
          } >> "$GITHUB_STEP_SUMMARY"
