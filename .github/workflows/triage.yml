name: Triage

# Every issue gets an answer.
#
# `fleet.yml` dispatches on `issues: [labeled]`, and only for `fleet:material`
# and `fleet:task`. An issue opened without one of those did nothing at all --
# no run, no comment, no notice. It sat there looking filed, which is worse
# than being refused.
#
# What is mechanical is in `tools/triage.py`: whether anything routes this
# issue, and what to do with the answer. What is judgement -- what the issue
# actually is -- is the agent's, and it arrives as `/tmp/triage.json`.

on:
  issues:
    types: [opened, reopened]
  # The edge is not enough. An issue open before this workflow landed, one
  # whose run died, one filed while the credential was missing: nothing would
  # look at any of them again. #84 sat unlabelled for fifteen hours that way.
  # Daily, so a stranded issue waits a day at worst rather than forever.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Which issues this run is about: the one the event named, or every open
  # issue nothing routes. One program answers both, so a schedule and an
  # event cannot disagree about what "needs triage" means.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # Per issue for an event, one shared group for the sweeps. Not
      # cancel-in-progress: a plan takes seconds, and cancelling one takes
      # `triage` down with it through `needs`.
      group: triage-plan-${{ github.event.issue.number || 'sweep' }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    outputs:
      issues: ${{ steps.plan.outputs.issues }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # `--issue` only when an event named one; a schedule passes none
          # and gets the sweep.
          python3 tools/triage.py --plan ${ISSUE:+--issue "$ISSUE"}

  triage:
    name: Triage
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      # One leg per issue, and a failed leg must not cancel the others: the
      # whole point is that no issue is left unanswered because another one
      # was awkward.
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.plan.outputs.issues) }}
    concurrency:
      # Per issue, on the leg rather than the workflow -- a sweep's legs are
      # different issues and must not serialise behind one group. Not
      # cancel-in-progress: a triage half-done leaves an issue labelled and
      # undispatched, which is the state this workflow exists to prevent.
      group: triage-${{ matrix.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Longer than the work needs, shorter than the hours a hung job bills.
    timeout-minutes: 15
    environment: Fleet
    permissions:
      contents: read
      # Labelling, commenting and closing.
      issues: write
      # `gh workflow run fleet.yml` -- the label alone cannot dispatch,
      # because events made with `GITHUB_TOKEN` start no runs.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Does anything route this issue
        id: gap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ matrix.issue }}
        run: python3 tools/triage.py --check --issue "$ISSUE"

      - name: Is there a credential to run with
        id: key
        if: steps.gap.outputs.triage == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/credential.py

      - name: Build the brief
        id: brief
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ matrix.issue }}
        run: |
          set -euo pipefail
          # Read from the API rather than the event payload: a sweep has no
          # payload, and reading it one way means the schedule and the event
          # brief the agent identically. Into a file, never interpolated into
          # this body -- an issue title is a stranger's text, and an
          # expression expanded into a shell body is a statement, not a
          # string.
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" \
            --jq '.title + "\n\n" + (.body // "")' > /tmp/issue.md
          python3 tools/fleet_brief.py --trigger issue-triage \
            --issue "$ISSUE" --issue-body-file /tmp/issue.md > /tmp/brief.md
          {
            echo "BRIEF<<BRIEF_EOF"
            cat /tmp/brief.md
            echo "BRIEF_EOF"
          } >> "$GITHUB_ENV"

      - name: Decide what it is
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_OAUTH }}
          anthropic_api_key: ${{ env.CLAUDE_API_KEY }}
          prompt: ${{ env.BRIEF }}
          display_report: true
          allowed_bots: "*"
          claude_args: >-
            --model claude-haiku-4-5-20251001
            --max-turns 12
            --allowedTools "Read,Grep,Glob,Write"

      # `always()`: a triage that crashed must still say something on the
      # issue. With no verdict file `--apply` routes to `human`, which is the
      # outcome this whole workflow exists to guarantee -- never silence.
      - name: Apply it
        if: always() && steps.gap.outputs.triage == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ matrix.issue }}
        run: python3 tools/triage.py --apply --issue "$ISSUE" --verdict /tmp/triage.json
