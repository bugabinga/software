name: Claude

# Agents inside GitHub: write @claude in an issue, a pull-request comment or a
# review comment and one picks the work up in CI, with the repository checked
# out and the book's own gates available to it.
#
# This is the surface for "@claude the link in chapter 2 is dead" or "@claude
# why did this build fail". The scheduled fleet (docs/FLEET.md) handles the
# recurring work; this handles the asks.
#
# Requires an API key in repository secrets. Without it every run exits early
# with a notice instead of failing, so this workflow can sit here unarmed
# until the key is added.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  # One agent per issue or pull request at a time.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    # Only on an explicit mention, and never on a bot's own words -- otherwise
    # the fleet's own pull-request bodies would summon it in a loop.
    if: |
      github.event.sender.type != 'Bot' && (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.review.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        (github.event_name == 'issues' && github.event.action == 'assigned')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Check that the key is present
        id: key
        env:
          CLAUDE_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${CLAUDE_KEY:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No API key secret is set, so there is no agent to run. Add ANTHROPIC_API_KEY under Settings, Secrets and variables, Actions to arm this workflow."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE.md carries the repository's invariants; .claude/agents and
          # .claude/skills carry the fleet. The agent reads them itself.
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"
