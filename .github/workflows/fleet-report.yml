name: Fleet report

# Weekly judgement on the fleet, published where the author can read it.
#
# The fleet works unattended, and the evidence that it worked well is spread
# across workflow runs, artifacts, branches, pull requests and issues -- all
# of which are pruned, closed or force-pushed on their own schedules. Ninety
# days after a bad week there is nothing left to look at. So once a week this
# gathers what exists into one page and one appended line of history, and the
# history outlives everything it was derived from.
#
# The page is published to <base>/fleet/ -- reachable, `noindex`, absent from
# the navigation, the sitemap and the search index. It is about the machinery,
# not the book, and a reader who wandered into it from a chapter would be
# right to be confused.
#
# Two branches of generated output now: `gh-pages` is the site, `fleet-log` is
# this. Neither is ever edited by hand. `fleet-log` differs in that its
# history is the point, so it accumulates rather than being force-pushed.

on:
  schedule:
    # Mondays, after the weekly garden at 07:00 has had its hour, so the week
    # it reports on includes the run that happens the same morning.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: How many days to report on
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  # `read` to gather runs and artifacts, `write` to nudge publish.yml at the
  # end so the week's report is readable on Monday rather than whenever the
  # book next changes.
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: fleet-report
  cancel-in-progress: false

jobs:
  report:
    name: Judge the fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the log this appends to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fleet-log
          if git ls-remote --exit-code --heads origin fleet-log > /dev/null 2>&1; then
            git fetch -q --depth=1 origin fleet-log
            # Named explicitly rather than checked out wholesale: this is a
            # working tree with the repository in it, and a checkout of
            # another branch over the top of it is not something to do for
            # the sake of one file.
            git show FETCH_HEAD:history.jsonl > fleet-log/history.jsonl 2>/dev/null || true
            # One line per run, as opposed to one line per week. Both are
            # append-only and both have to come back before anything appends,
            # or a week of history is replaced by a week of history.
            git show FETCH_HEAD:runs.jsonl > fleet-log/runs.jsonl 2>/dev/null || true
            echo "::notice::continuing an existing fleet-log ($(wc -l < fleet-log/history.jsonl 2>/dev/null || echo 0) weeks, $(wc -l < fleet-log/runs.jsonl 2>/dev/null || echo 0) runs)"
          else
            echo "::notice::no fleet-log yet; this run starts one"
          fi

      - name: Gather and judge
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          set -euo pipefail
          python3 tools/fleet_report.py \
            --days "$DAYS" \
            --html fleet-log/report.html \
            --history fleet-log/history.jsonl \
            --runs-log fleet-log/runs.jsonl \
            | tee /tmp/summary.txt

          {
            echo '### Fleet report'
            echo
            echo '```'
            cat /tmp/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # A commit on top of what is there, not a new history over it.
          #
          # This used to `rm -rf .git && git init`, so every week's push was
          # necessarily a force-push over an unrelated root. That kept the
          # branch to one commit, and the price was that the branch could not
          # be protected and could not be recovered: the JSONL files were the
          # only copy of a record whose entire purpose is to outlive the
          # API's 90-day window. A commit per week is 52 small deltas a year.
          #
          # Fast-forward only, which is what lets `non_fast_forward` guard
          # this branch with nothing on the bypass list.
          work=$(mktemp -d)
          if git ls-remote --exit-code --heads origin fleet-log > /dev/null 2>&1; then
            git clone -q --branch fleet-log --single-branch "$remote" "$work"
          else
            git clone -q --no-checkout --depth 1 "$remote" "$work"
            git -C "$work" checkout -q --orphan fleet-log
            git -C "$work" rm -rq --cached . 2>/dev/null || true
            find "$work" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          cp fleet-log/. "$work"/ -r
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::the report is unchanged; nothing to push"
            exit 0
          fi
          git commit -q -m "Fleet report $(date -u +%Y-%m-%d)

          Generated by tools/fleet_report.py. Nothing on this branch is
          edited by hand; history.jsonl and runs.jsonl accumulate, report.html
          is replaced."
          git push -q "$remote" fleet-log
          echo "::notice::pushed the report to fleet-log; it reaches the site on the next publish"

      # The site is republished from `main`, not from here, so the page only
      # becomes visible when something next lands. Nudging publish means the
      # weekly report is readable on Monday rather than whenever the book
      # happens to change.
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh workflow run publish.yml --ref main; then
            echo "::notice::asked publish.yml to redeploy so the report is live"
          else
            echo "::warning::could not start publish.yml; the report will appear with the next deployment"
          fi
