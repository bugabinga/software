name: Agent branches

# The GitHub-side bookkeeping for work the fleet pushes.
#
# Agents push a branch named `agent/**` and stop there. Everything after that
# happens here, and deliberately uses nothing but the workflow token:
#
#   * an unattended session cannot be relied on to call the pull-request API
#     -- GraphQL is restricted in that environment, so `gh pr` does not work,
#     and mutating REST calls can be refused -- while `git push` always works;
#   * the decision to merge is then made by rules that live in the repository
#     and can be read, rather than by whatever an agent concluded at 07:00;
#   * and no repository-level auto-merge, no personal access token, and no
#     "Actions may create pull requests" permission are required. A pull
#     request is opened when that permission happens to be granted, because
#     it reads better; when it is not, a green chore is merged directly and
#     anything else is reported as an issue with a compare link.
#
# The policy enforced here is the one in docs/FLEET.md.

on:
  push:
    branches:
      - "agent/**"
      - "maintenance/**"
  workflow_run:
    # Both, because either can be the last to report. CI runs from the push
    # that created the branch; `Fleet review` is dispatched when the pull
    # request is opened, and it is a required check, so a wake on CI alone
    # decides while the verdict is still in progress, says "has checks that
    # are not green", and nothing brings it back.
    workflows: [CI, Fleet review]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  # To dispatch `fleet-review.yml` on a pull request this workflow opened.
  # See "Ask for the verdict the open will not start" below for why that is
  # not optional.
  actions: write

jobs:
  branches:
    # One job, three things, each gated by the event that wants it. They were
    # three jobs, for about eight seconds of work -- three checkouts and three
    # slots out of a concurrency limit the whole account shares. Billed
    # nothing, since the repository is public; the slots are real, and none
    # of these needs to run in parallel with the others.
    name: Agent branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - if: github.event_name == 'push'
        name: Open one if this repository allows it
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          existing=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "::notice::#$existing already tracks $BRANCH"
            exit 0
          fi

          # Not the commit body. A commit answers "why is this line like
          # this" for someone holding the diff; a pull request answers "should
          # this land" for someone holding nothing. Pasting one into the other
          # is how this workflow used to produce descriptions that read like
          # footnotes, and it is the one thing CLAUDE.md's three registers
          # tells every worker here not to do.
          #
          # A workflow cannot write the story -- that is judgement, and it
          # belongs to whoever opened the branch. What it can do is lay out
          # the facts a reviewer needs first, and say plainly that the
          # narrative is missing rather than dressing the commit body up as
          # one.
          subject=$(git log -1 --format=%s)

          # Asked of the API rather than of git. This job checks out with
          # `fetch-depth: 2`, so `origin/main` is not in the clone: every
          # `git log origin/main..HEAD` here would have failed and fallen
          # through to a one-commit, no-files body without saying so. The
          # compare endpoint has both, needs no history, and is what the
          # merge job below already uses.
          comparison=$(gh api "repos/$REPO/compare/main...$BRANCH")
          {
            echo "Opened for \`$BRANCH\`, which the fleet pushed and cannot open a"
            echo "pull request for itself."
            echo
            echo "**Commits**"
            echo
            echo "$comparison" | jq -r '.commits[] | "- " + (.commit.message | split("\n")[0])'
            echo
            echo "**Files**"
            echo
            echo "$comparison" | jq -r '.files[]? | "- `" + .filename + "`"'
            echo
            echo "The commit messages carry the technical reasoning. Nobody has"
            echo "written the story of this change — what hurt, and what is"
            echo "different now — because no human opened it."
            echo
            echo "---"
            echo "_Opened by the agent-branches workflow. See docs/FLEET.md._"
          } > /tmp/pr-body.md

          if number=$(gh api -X POST "repos/$REPO/pulls" \
              -f title="$subject" \
              -f head="$BRANCH" \
              -f base=main \
              -F body=@/tmp/pr-body.md \
              --jq .number 2>/tmp/pr-error); then
            echo "::notice::opened #$number for $BRANCH"

            # Ask for the verdict the open will not start.
            #
            # This POST is made with the workflow token, so the
            # `pull_request` runs it raises are created and then held in an
            # approval-required state -- the same wall `fleet-respond.yml`
            # hit from the other side (runs 34760403200, 34760403209).
            # `ci.yml` survives it because it also triggers on `agent/**`
            # pushes; `fleet-review.yml` has no push trigger, because a push
            # carries no pull request to review. So `Fleet review` -- a
            # required check -- would never report, and every pull request
            # this step opens would be unmergeable.
            #
            # `workflow_dispatch` is one of the events a `GITHUB_TOKEN` may
            # still raise, and a dispatch carries no pull request either, so
            # the number goes in as an input.
            if gh workflow run fleet-review.yml --ref "$BRANCH" \
                -f pr="$number" 2>/tmp/dispatch-error; then
              echo "::notice::dispatched fleet-review.yml for #$number"
            else
              cat /tmp/dispatch-error >&2
              echo "::warning::#$number is open but Fleet review could not be started on it, so it cannot merge until somebody runs that workflow from the Actions tab with pr=$number."
            fi
            exit 0
          fi

          if grep -q "not permitted to create or approve pull requests" /tmp/pr-error; then
            # Not a failure: the merge job below handles the branch without a
            # pull request. Opening one is the nicer presentation, not the
            # mechanism.
            echo "::notice::this repository does not let Actions open pull requests; the branch will be handled without one"
            exit 0
          fi

          cat /tmp/pr-error >&2
          exit 1

      - if: github.event_name != 'workflow_dispatch'
        name: Close the ones whose branch is done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null)
                      | select(.title | test("^(Ready to review|Green and unmerged): "))
                      | "\(.number)\t\(.title | sub("^[^:]+: "; ""))"' \
            > /tmp/tracking.tsv || true

          closed=0
          while IFS=$'\t' read -r number branch; do
            [ -n "${branch:-}" ] || continue

            reason=""
            if ! gh api "repos/$REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
              reason="\`$branch\` no longer exists."
            else
              pulls=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$branch&state=all")
              merged=$(echo "$pulls" | jq -r '[.[] | select(.merged_at != null)][0].number // empty')
              opened=$(echo "$pulls" | jq -r '[.[] | select(.state == "open")][0].number // empty')
              if [ -n "$merged" ]; then
                reason="\`$branch\` was merged in #$merged."
              elif [ -n "$opened" ]; then
                # A notice is filed when no pull request exists, and says so.
                # Once one does, the notice is answering a question nobody is
                # asking any more and the pull request is where the branch is
                # discussed. Without this the notice outlives the thing it
                # was about: #53 was still open for `agent/epub` after its
                # pull request had been reviewed.
                reason="#$opened now tracks \`$branch\`, which is where it is reviewed."
              fi
            fi
            [ -n "$reason" ] || continue

            printf '%s Closing this notice: it tracked one branch and that branch is done.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
              "$reason" > /tmp/close.md
            gh api -X POST "repos/$REPO/issues/$number/comments" -F body=@/tmp/close.md > /dev/null
            gh api -X PATCH "repos/$REPO/issues/$number" \
              -f state=closed -f state_reason=completed > /dev/null
            echo "closed #$number ($branch)"
            closed=$((closed + 1))
          done < /tmp/tracking.tsv

          echo "::notice::closed $closed finished tracking issue(s)"
      # The decision this workflow exists to make lives in a program with a
      # self-test, not here: it is the only thing in the tree that puts a
      # commit on `main` without a human, and a `run:` block can only be
      # tested by pushing. It had been wrong twice before it moved --
      # grepping for a check named `Build` after the job was renamed `CI`,
      # and treating `diverged` as "nothing to give" -- and both are cases in
      # `tools/agent_branch.py --self-test` now.
      - if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch != 'main'
        name: Decide what this branch has earned
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/agent_branch.py --branch "$BRANCH" --sha "$HEAD_SHA"
