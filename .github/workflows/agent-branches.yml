name: Agent branches

# The GitHub-side bookkeeping for work the fleet pushes.
#
# Agents push a branch named `agent/**` and stop there. Everything after that
# happens here, and deliberately uses nothing but the workflow token:
#
#   * an unattended session cannot be relied on to call the pull-request API
#     -- GraphQL is restricted in that environment, so `gh pr` does not work,
#     and mutating REST calls can be refused -- while `git push` always works;
#   * the decision to merge is then made by rules that live in the repository
#     and can be read, rather than by whatever an agent concluded at 07:00;
#   * and no repository-level auto-merge, no personal access token, and no
#     "Actions may create pull requests" permission are required. A pull
#     request is opened when that permission happens to be granted, because
#     it reads better; when it is not, a green chore is merged directly and
#     anything else is reported as an issue with a compare link.
#
# The policy enforced here is the one in docs/FLEET.md.

on:
  push:
    branches:
      - "agent/**"
      - "maintenance/**"
  workflow_run:
    # Both, because either can be the last to report. CI runs from the push
    # that created the branch; `Fleet review` is dispatched when the pull
    # request is opened, and it is a required check, so a wake on CI alone
    # decides while the verdict is still in progress, says "has checks that
    # are not green", and nothing brings it back.
    workflows: [CI, Fleet review]
    types: [completed]
  workflow_dispatch:

concurrency:
  # One at a time, repository-wide. This decides what reaches `main`: two
  # copies racing could read the same green branch and both try to merge it,
  # and the loser's error is indistinguishable from a real refusal. Not
  # cancel-in-progress -- a merge interrupted half-way is the one outcome
  # worse than waiting.
  group: agent-branches
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  # To dispatch `fleet-review.yml` on a pull request this workflow opened.
  # See "Ask for the verdict the open will not start" below for why that is
  # not optional.
  actions: write

jobs:
  branches:
    # One job, three things, each gated by the event that wants it. They were
    # three jobs, for about eight seconds of work -- three checkouts and three
    # slots out of a concurrency limit the whole account shares. Billed
    # nothing, since the repository is public; the slots are real, and none
    # of these needs to run in parallel with the others.
    name: Agent branches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      # A branch the fleet pushed cannot open its own pull request, and on
      # a repository where Actions may not open one at all this is a notice
      # rather than a failure -- `Decide what this branch has earned` handles
      # a branch without one.
      - if: github.event_name == 'push'
        name: Open one if this repository allows it
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: python3 tools/agent_branch.py --open-pull --branch "$BRANCH"

      # The issues that stood in for a pull request, once there is one.
      - if: github.event_name != 'workflow_dispatch'
        name: Close the ones whose branch is done
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/agent_branch.py --close-finished

      # And the branches themselves. `delete_branch_on_merge` covers a merge
      # through the web UI and `act` deletes what it merges, but ten branches
      # merged before that setting was applied sat here for a week -- so the
      # sweep exists rather than the two paths being trusted to stay total.
      - if: github.event_name != 'workflow_dispatch'
        name: Delete the branches whose work is merged
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/agent_branch.py --prune

      # The decision this workflow exists to make lives in a tested program,
      # not here: it is the only thing in the tree that puts a
      # commit on `main` without a human, and a `run:` block can only be
      # tested by pushing. It had been wrong twice before it moved --
      # grepping for a check named `Build` after the job was renamed `CI`,
      # and treating `diverged` as "nothing to give" -- and both are cases in
      # `tools/agent_branch.py`'s test cases now.
      - if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch != 'main'
        name: Decide what this branch has earned
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/agent_branch.py --branch "$BRANCH" --sha "$HEAD_SHA"
