name: Agent branches

# The GitHub-side bookkeeping for work the fleet pushes.
#
# Agents push a branch named `agent/**` and stop there. Everything after that
# happens here, and deliberately uses nothing but the workflow token:
#
#   * an unattended session cannot be relied on to call the pull-request API
#     -- GraphQL is restricted in that environment, so `gh pr` does not work,
#     and mutating REST calls can be refused -- while `git push` always works;
#   * the decision to merge is then made by rules that live in the repository
#     and can be read, rather than by whatever an agent concluded at 07:00;
#   * and no repository-level auto-merge, no personal access token, and no
#     "Actions may create pull requests" permission are required. A pull
#     request is opened when that permission happens to be granted, because
#     it reads better; when it is not, a green chore is merged directly and
#     anything else is reported as an issue with a compare link.
#
# The policy enforced here is the one in docs/FLEET.md.

on:
  push:
    branches:
      - "agent/**"
      - "maintenance/**"
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  open-pull-request:
    name: Open the pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Open one if this repository allows it
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          existing=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "::notice::#$existing already tracks $BRANCH"
            exit 0
          fi

          # The branch's own commit message is the description: an agent that
          # explained itself in the commit does not have to explain twice.
          subject=$(git log -1 --format=%s)
          git log -1 --format=%b > /tmp/pr-body.md
          printf '\n---\n_Opened by the agent-branches workflow. See docs/FLEET.md._\n' \
            >> /tmp/pr-body.md

          if number=$(gh api -X POST "repos/$REPO/pulls" \
              -f title="$subject" \
              -f head="$BRANCH" \
              -f base=main \
              -F body=@/tmp/pr-body.md \
              --jq .number 2>/tmp/pr-error); then
            echo "::notice::opened #$number for $BRANCH"
            exit 0
          fi

          if grep -q "not permitted to create or approve pull requests" /tmp/pr-error; then
            # Not a failure: the merge job below handles the branch without a
            # pull request. Opening one is the nicer presentation, not the
            # mechanism.
            echo "::notice::this repository does not let Actions open pull requests; the branch will be handled without one"
            exit 0
          fi

          cat /tmp/pr-error >&2
          exit 1

  decide:
    name: Merge green chores
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Decide what this branch has earned
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          number=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" \
            --jq '.[0].number // empty')

          # A held branch is never merged automatically, whatever it touches.
          # The escape hatch for "green, but look at it" is the `hold` label
          # on its pull request, or the word [hold] in its commit subject.
          if [ -n "$number" ] &&
             gh api "repos/$REPO/issues/$number/labels" --jq '.[].name' | grep -qx 'hold'; then
            echo "::notice::#$number is labelled hold; leaving it"
            exit 0
          fi

          comparison=$(gh api "repos/$REPO/compare/main...$BRANCH")

          # Only a branch that is purely ahead of main has work to offer. A
          # squash-merged branch keeps its original commits and so reads as
          # "diverged" forever; comparing it against main then reports main's
          # later work as a difference, backwards, which is how this workflow
          # once raised review issues for branches already merged.
          status=$(echo "$comparison" | jq -r '.status')
          if [ "$status" != "ahead" ]; then
            echo "::notice::$BRANCH is $status relative to main; nothing to do"
            exit 0
          fi

          subject=$(echo "$comparison" | jq -r '.commits[-1].commit.message' | head -1)
          case "$subject" in
            *"[hold]"*) echo "::notice::$BRANCH is marked [hold]; leaving it"; exit 0 ;;
          esac

          files=$(echo "$comparison" | jq -r '.files[]?.filename')
          if [ -z "$files" ]; then
            echo "nothing to merge: $BRANCH does not differ from main"
            exit 0
          fi
          echo "files changed:"; echo "$files" | sed 's/^/  /'

          # Chore, per docs/FLEET.md: nothing that is the book, its styling,
          # or the automation itself. A change to .github/ or .claude/ is the
          # machinery deciding its own future, which is a human's call.
          protected='^(book/chapters/|book/book\.toml|book/lib/|site/|\.github/|\.claude/)'

          # Green means every check on this exact commit concluded well, not
          # that the run which triggered this workflow happened to pass.
          states=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '.check_runs[] | select(.name != "Merge green chores" and .name != "Open the pull request") | "\(.name):\(.status):\(.conclusion // "pending")"')
          echo "checks on $HEAD_SHA:"; echo "$states" | sed 's/^/  /'
          if echo "$states" | grep -vE ':completed:(success|neutral|skipped)$' | grep -q .; then
            echo "::notice::$BRANCH has checks that are not green; leaving it"
            exit 0
          fi

          if echo "$files" | grep -qE "$protected"; then
            # Needs the author. If a pull request exists it is already the
            # place to read it; if none could be opened, one issue stands in
            # for it, updated rather than duplicated.
            if [ -n "$number" ]; then
              echo "::notice::#$number touches the book or the automation; leaving it for the author"
              exit 0
            fi

            title="Ready to review: $BRANCH"
            body=$(mktemp)
            {
              echo "\`$BRANCH\` is green and waiting, and touches the book or the"
              echo "automation, so it is not merged automatically."
              echo
              echo "**[Read the diff]($SERVER/$REPO/compare/main...$BRANCH)** ·"
              echo "**[Open a pull request]($SERVER/$REPO/compare/main...$BRANCH?expand=1)**"
              echo
              echo "> $subject"
              echo
              echo "Files: "
              echo "$files" | sed 's/^/- `/; s/$/`/'
              echo
              echo "---"
              echo "_Generated by [Claude Code](https://claude.ai/code)_"
            } > "$body"

            open=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
              --jq "[.[] | select(.title == \"$title\")][0].number // empty")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file "$body" --repo "$REPO" ||
                gh api -X POST "repos/$REPO/issues/$open/comments" -F body=@"$body" > /dev/null
              echo "::notice::updated issue #$open for $BRANCH"
            else
              new=$(gh api -X POST "repos/$REPO/issues" \
                -f title="$title" -F body=@"$body" --jq .number)
              echo "::notice::opened issue #$new for $BRANCH"
            fi
            exit 0
          fi

          # A green chore. Merge it, with or without a pull request.
          if [ -n "$number" ]; then
            mergeable=$(gh api "repos/$REPO/pulls/$number" --jq '.mergeable_state')
            if [ "$mergeable" = "dirty" ]; then
              echo "::notice::#$number conflicts with main; leaving it"
              exit 0
            fi
            gh api -X PUT "repos/$REPO/pulls/$number/merge" \
              -f merge_method=squash -f sha="$HEAD_SHA" > /dev/null
            echo "::notice::merged #$number"
          else
            # No pull request could be opened, so merge the branch itself.
            # This needs only `contents: write`.
            gh api -X POST "repos/$REPO/merges" \
              -f base=main \
              -f head="$BRANCH" \
              -f commit_message="$subject

          Merged from $BRANCH by the agent-branches workflow: a chore, green on
          $HEAD_SHA. See docs/FLEET.md for what counts as one." > /dev/null
            echo "::notice::merged $BRANCH into main"
          fi

          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" > /dev/null 2>&1 || true
