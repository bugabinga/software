name: Agent branches

# The GitHub-side bookkeeping for work the fleet pushes.
#
# Agents push a branch named `agent/**` and stop there. Everything after that
# happens here, and deliberately uses nothing but the workflow token:
#
#   * an unattended session cannot be relied on to call the pull-request API
#     -- GraphQL is restricted in that environment, so `gh pr` does not work,
#     and mutating REST calls can be refused -- while `git push` always works;
#   * the decision to merge is then made by rules that live in the repository
#     and can be read, rather than by whatever an agent concluded at 07:00;
#   * and no repository-level auto-merge, no personal access token, and no
#     "Actions may create pull requests" permission are required. A pull
#     request is opened when that permission happens to be granted, because
#     it reads better; when it is not, a green chore is merged directly and
#     anything else is reported as an issue with a compare link.
#
# The policy enforced here is the one in docs/FLEET.md.

on:
  push:
    branches:
      - "agent/**"
      - "maintenance/**"
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  open-pull-request:
    name: Open the pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Open one if this repository allows it
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          existing=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "::notice::#$existing already tracks $BRANCH"
            exit 0
          fi

          # The branch's own commit message is the description: an agent that
          # explained itself in the commit does not have to explain twice.
          subject=$(git log -1 --format=%s)
          git log -1 --format=%b > /tmp/pr-body.md
          printf '\n---\n_Opened by the agent-branches workflow. See docs/FLEET.md._\n' \
            >> /tmp/pr-body.md

          if number=$(gh api -X POST "repos/$REPO/pulls" \
              -f title="$subject" \
              -f head="$BRANCH" \
              -f base=main \
              -F body=@/tmp/pr-body.md \
              --jq .number 2>/tmp/pr-error); then
            echo "::notice::opened #$number for $BRANCH"
            exit 0
          fi

          if grep -q "not permitted to create or approve pull requests" /tmp/pr-error; then
            # Not a failure: the merge job below handles the branch without a
            # pull request. Opening one is the nicer presentation, not the
            # mechanism.
            echo "::notice::this repository does not let Actions open pull requests; the branch will be handled without one"
            exit 0
          fi

          cat /tmp/pr-error >&2
          exit 1

  tidy:
    name: Close finished tracking issues
    # Every branch this workflow cannot merge gets an issue saying so, and
    # until now nothing ever closed one. Sixteen were open at once, all but a
    # couple naming branches that had long since merged, which is how an issue
    # list stops being something anybody reads.
    #
    # An issue here tracks exactly one branch, named in its title, so the
    # question "is this still true" has a mechanical answer: the branch is
    # gone, or a pull request for it merged. Runs on every push and every CI
    # completion, because the moment a branch lands is the moment its notice
    # becomes litter.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Close the ones whose branch is done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null)
                      | select(.title | test("^(Ready to review|Green and unmerged): "))
                      | "\(.number)\t\(.title | sub("^[^:]+: "; ""))"' \
            > /tmp/tracking.tsv || true

          closed=0
          while IFS=$'\t' read -r number branch; do
            [ -n "${branch:-}" ] || continue

            reason=""
            if ! gh api "repos/$REPO/git/ref/heads/$branch" > /dev/null 2>&1; then
              reason="\`$branch\` no longer exists."
            else
              pulls=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$branch&state=all")
              merged=$(echo "$pulls" | jq -r '[.[] | select(.merged_at != null)][0].number // empty')
              opened=$(echo "$pulls" | jq -r '[.[] | select(.state == "open")][0].number // empty')
              if [ -n "$merged" ]; then
                reason="\`$branch\` was merged in #$merged."
              elif [ -n "$opened" ]; then
                # A notice is filed when no pull request exists, and says so.
                # Once one does, the notice is answering a question nobody is
                # asking any more and the pull request is where the branch is
                # discussed. Without this the notice outlives the thing it
                # was about: #53 was still open for `agent/epub` after its
                # pull request had been reviewed.
                reason="#$opened now tracks \`$branch\`, which is where it is reviewed."
              fi
            fi
            [ -n "$reason" ] || continue

            printf '%s Closing this notice: it tracked one branch and that branch is done.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
              "$reason" > /tmp/close.md
            gh api -X POST "repos/$REPO/issues/$number/comments" -F body=@/tmp/close.md > /dev/null
            gh api -X PATCH "repos/$REPO/issues/$number" \
              -f state=closed -f state_reason=completed > /dev/null
            echo "closed #$number ($branch)"
            closed=$((closed + 1))
          done < /tmp/tracking.tsv

          echo "::notice::closed $closed finished tracking issue(s)"

  decide:
    name: Merge green chores
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Decide what this branch has earned
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail

          number=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=open" \
            --jq '.[0].number // empty')

          # A held branch is never merged automatically, whatever it touches.
          # The escape hatch for "green, but look at it" is the `hold` label
          # on its pull request, or the word [hold] in its commit subject.
          if [ -n "$number" ] &&
             gh api "repos/$REPO/issues/$number/labels" --jq '.[].name' | grep -qx 'hold'; then
            echo "::notice::#$number is labelled hold; leaving it"
            exit 0
          fi

          comparison=$(gh api "repos/$REPO/compare/main...$BRANCH")

          # Two ways a branch has nothing left to offer, and neither is
          # "diverged": that is the normal state of any branch created before
          # main moved on, and testing for it blocked real work.
          #
          #   1. It is not ahead at all -- already merged whole, or empty.
          #   2. A pull request for it was merged. Squash merging leaves the
          #      branch holding its original commits, so it stays ahead and
          #      diverged forever even though its work is in main. Comparing
          #      such a branch reports main's later work as a difference,
          #      backwards, which is how this workflow once raised review
          #      issues for branches already merged.
          ahead=$(echo "$comparison" | jq -r '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "::notice::$BRANCH is not ahead of main; nothing to do"
            exit 0
          fi

          merged=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$BRANCH&state=all" \
            --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged" != "0" ]; then
            echo "::notice::$BRANCH has already been merged through a pull request; nothing to do"
            exit 0
          fi

          subject=$(echo "$comparison" | jq -r '.commits[-1].commit.message' | head -1)
          case "$subject" in
            *"[hold]"*) echo "::notice::$BRANCH is marked [hold]; leaving it"; exit 0 ;;
          esac

          files=$(echo "$comparison" | jq -r '.files[]?.filename')
          if [ -z "$files" ]; then
            echo "nothing to merge: $BRANCH does not differ from main"
            exit 0
          fi
          echo "files changed:"; echo "$files" | sed 's/^/  /'

          # What still needs a human, per docs/FLEET.md: only the machinery.
          # A change to .github/ or .claude/ is the automation deciding its
          # own future, and an agent that can rewrite its own brief or its own
          # merge rule is not supervised by anything.
          #
          # The book itself is not on this list. The author delegated
          # decisions about it to the fleet and controls it by controlling the
          # agent definitions, so a green change to the book merges.
          protected='^(\.github/|\.claude/)'

          # Green means every check on this exact commit concluded well, not
          # that the run which triggered this workflow happened to pass.
          #
          # And "every check" has to mean at least one. Asking whether any
          # check is not green answers yes for a commit that has no checks at
          # all, which is not a theoretical case: a branch pushed by an agent
          # using the workflow token gets no runs whatsoever, because
          # GITHUB_TOKEN pushes do not trigger workflows. The first branch the
          # fleet ever delivered, `agent/typst-0.15.1`, had exactly zero check
          # runs on it. Nothing merged it only because it fell foul of a later
          # rule -- which is luck, not a safeguard.
          #
          # So `Build` -- CI's own job, the one that compiles the book -- must
          # be present and successful. It is polled rather than read once:
          # this job starts the instant CI reports completion, and the check
          # runs are not always visible by then. Sixty seconds of asking, then
          # the branch is left alone and said so.
          states=""
          for attempt in $(seq 1 12); do
            states=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[] | select(.name != "Merge green chores" and .name != "Open the pull request") | "\(.name):\(.status):\(.conclusion // "pending")"')
            if echo "$states" | grep -q '^Build:completed:'; then
              break
            fi
            echo "waiting for checks on $HEAD_SHA (attempt $attempt)"
            sleep 5
          done

          echo "checks on $HEAD_SHA:"; echo "$states" | sed 's/^/  /'
          if ! echo "$states" | grep -q '^Build:completed:success$'; then
            echo "::notice::$BRANCH has no successful Build check on $HEAD_SHA, so there is nothing to call green; leaving it"
            exit 0
          fi
          if echo "$states" | grep -vE ':completed:(success|neutral|skipped)$' | grep -q .; then
            echo "::notice::$BRANCH has checks that are not green; leaving it"
            exit 0
          fi

          if echo "$files" | grep -qE "$protected"; then
            # Needs the author. If a pull request exists it is already the
            # place to read it; if none could be opened, one issue stands in
            # for it, updated rather than duplicated.
            if [ -n "$number" ]; then
              echo "::notice::#$number changes the automation itself; leaving it for the author"
              exit 0
            fi

            title="Ready to review: $BRANCH"
            body=$(mktemp)
            {
              echo "\`$BRANCH\` is green and waiting. It changes the automation"
              echo "itself -- \`.github/\` or \`.claude/\` -- which is the one thing"
              echo "that is not merged automatically."
              echo
              echo "**[Read the diff]($SERVER/$REPO/compare/main...$BRANCH)** ·"
              echo "**[Open a pull request]($SERVER/$REPO/compare/main...$BRANCH?expand=1)**"
              echo
              echo "> $subject"
              echo
              echo "Files: "
              echo "$files" | sed 's/^/- `/; s/$/`/'
              echo
              echo "---"
              echo "_Generated by [Claude Code](https://claude.ai/code)_"
            } > "$body"

            open=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
              --jq "[.[] | select(.title == \"$title\")][0].number // empty")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file "$body" --repo "$REPO" ||
                gh api -X POST "repos/$REPO/issues/$open/comments" -F body=@"$body" > /dev/null
              echo "::notice::updated issue #$open for $BRANCH"
            else
              new=$(gh api -X POST "repos/$REPO/issues" \
                -f title="$title" -F body=@"$body" --jq .number)
              echo "::notice::opened issue #$new for $BRANCH"
            fi
            exit 0
          fi

          # Green, and the fleet's to merge. Squash only: `main` requires
          # linear history, so the merge-commit route (POST /merges) that this
          # workflow used before is rejected outright with "Repository rule
          # violations found". Squashing through a pull request is the only
          # shape the branch protection accepts.
          merged_it=false
          if [ -n "$number" ]; then
            mergeable=$(gh api "repos/$REPO/pulls/$number" --jq '.mergeable_state')
            if [ "$mergeable" = "dirty" ]; then
              echo "::notice::#$number conflicts with main; leaving it"
              exit 0
            fi
            if gh api -X PUT "repos/$REPO/pulls/$number/merge" \
                -f merge_method=squash -f sha="$HEAD_SHA" > /dev/null 2>/tmp/merge-error; then
              echo "::notice::merged #$number"
              merged_it=true
            fi
          fi

          if [ "$merged_it" = true ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" > /dev/null 2>&1 || true
            exit 0
          fi

          # Could not merge. That is a fact about the repository's settings,
          # not a fault in the branch, so it is reported once rather than
          # failing red on every run: the work is green and waiting, and
          # somebody has to be told which setting is holding it.
          reason="the merge was refused"
          if [ -z "$number" ]; then
            reason="no pull request exists, because this repository does not let Actions open them, and a direct merge commit is refused by the linear-history rule"
          elif grep -q "rule violations" /tmp/merge-error 2>/dev/null; then
            reason="the branch protection refused it: $(head -c 300 /tmp/merge-error)"
          elif [ -s /tmp/merge-error ]; then
            reason="$(head -c 300 /tmp/merge-error)"
          fi
          echo "::notice::$BRANCH is green but unmerged -- $reason"

          title="Green and unmerged: $BRANCH"
          body=$(mktemp)
          {
            echo "\`$BRANCH\` passed every check on \`$HEAD_SHA\` and the fleet"
            echo "was entitled to merge it, but could not."
            echo
            echo "> $reason"
            echo
            echo "**[Read the diff]($SERVER/$REPO/compare/main...$BRANCH)**"
            if [ -n "$number" ]; then echo " · **[#$number]($SERVER/$REPO/pull/$number)**"; fi
            echo
            echo "Two settings decide whether the fleet can land its own work:"
            echo "Actions being allowed to create pull requests, and a bypass"
            echo "actor for Actions on the branch ruleset. Without both, every"
            echo "fleet branch ends up here. See docs/FLEET.md."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "$body"

          open=$(gh api "repos/$REPO/issues?state=open&per_page=100" \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$open" ]; then
            gh api -X POST "repos/$REPO/issues/$open/comments" -F body=@"$body" > /dev/null
            echo "::notice::updated issue #$open"
          else
            new=$(gh api -X POST "repos/$REPO/issues" \
              -f title="$title" -F body=@"$body" --jq .number)
            echo "::notice::opened issue #$new"
          fi
