name: Release

# Tagging `v*` publishes an edition: the same book in every shape it has.
#
# The website is always current and always changing; a release is the opposite
# and that is its job. It is the version somebody can cite, hand to a reader
# with no network, or come back to in five years and find unchanged. So the
# formats attached here are the ones that survive on their own -- a PDF, an
# EPUB, one self-contained HTML file, and the site as a zip -- and none of
# them needs this repository or a running server to be read.
#
# What is deliberately not attached: the fleet's reports and any other
# machinery. A release is the book.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist)
        required: true

concurrency:
  # Per tag. A release is uploaded assets and a published record; a second
  # run for the same tag would fight the first over both. Never cancelled:
  # a half-uploaded release is worse than a slow one.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Attach the book to the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build the book
        uses: ./.github/actions/build-book

      # The slug decides what a reader downloads, and a release's assets
      # are named once -- there is no correcting them afterwards. It used to
      # be a Python heredoc nested inside a shell heredoc inside YAML.
      - name: Name the assets after the tag
        id: assets
        env:
          # A dispatch input is whatever a person typed.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/release_assets.py --tag "$TAG"

      - name: Check the EPUB before publishing it
        run: |
          set -euo pipefail
          python3 tools/check_epub.py "release/"*.epub

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          generate_release_notes: true
          files: release/*
