name: Labels

# Keeps the repository's labels in step with `.github/labels.toml`.
#
# Not cosmetics: `maintenance.yml` files its link-rot issue with `chore` and
# `agent-branches.yml` refuses to merge anything carrying `hold`, so a missing
# label is a workflow that fails at the moment it is needed. Neither existed
# in this repository until this file did.
#
# Creates and updates only. Deleting a label deletes it from every issue that
# carries it, which is not something a sync should do behind anyone's back.

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.toml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

concurrency:
  # One at a time. The sync is a read-then-write over the whole label set, so
  # two runs interleaving can re-create a label the other just updated.
  group: labels
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The roster is TOML, so `tomllib` reads it and this needs nothing
      # installed. It was YAML parsed by four regexes in a heredoc, then
      # briefly YAML parsed by PyYAML -- which is on the runner by luck and
      # not by declaration (`mise.toml`: every tool here is stdlib only).
      - name: Create or update each label
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/labels.py
