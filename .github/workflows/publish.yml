name: Publish

# The website is republished on every push to main, using nothing but the
# workflow token.
#
# It deploys by pushing the built site to the `gh-pages` branch rather than
# through actions/deploy-pages, because the Actions-native route needs the
# Pages site to exist already and creating one is privileged: the workflow
# token gets "Resource not accessible by integration", and the Pages API is
# not reachable from the author's Claude sessions at all. Pushing a branch
# needs no permission beyond `contents: write`, and GitHub serves a
# `gh-pages` branch without anyone configuring anything.
#
# If Pages is later set to build from Actions, the artifact upload and deploy
# steps are the two commented lines at the bottom of this file; nothing else
# changes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling, so the last
# push always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the book
        uses: ./.github/actions/build-book
        with:
          base-url: https://bugabinga.github.io/software/

      # The weekly fleet report, if one has been generated. It lives on its
      # own branch because it is not built from the book and must survive the
      # force-push below; copying it in here keeps one deployment path rather
      # than two things writing to gh-pages.
      - name: Fold in the fleet report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! git ls-remote --exit-code --heads origin fleet-log > /dev/null 2>&1; then
            echo "::notice::no fleet-log branch yet, so no fleet report to publish"
            exit 0
          fi
          git fetch -q --depth=1 origin fleet-log
          mkdir -p dist/fleet
          # Over the placeholder `tools/build.py` writes, which is what the
          # landing page links to until there is a report. Leaving it in
          # place is the right failure: a branch with no `report.html` yet is
          # the same situation as no branch at all.
          if git show FETCH_HEAD:report.html > dist/fleet/index.html 2>/dev/null; then
            echo "::notice::published the fleet report at /fleet/"
          else
            echo "::notice::fleet-log exists but carries no report.html; the placeholder stands"
          fi

      # A fresh orphan commit each time: this branch is generated output, so
      # its history carries no information worth keeping, and force-pushing
      # one commit keeps the repository from growing a copy of the book per
      # deployment.
      - name: Push the built site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA:0:7}

          Generated output, built from main by tools/build.py. Nothing on this
          branch is edited by hand; every deployment replaces all of it."
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "::notice::pushed the built site to gh-pages"

      # Best effort, and genuinely allowed to fail: if Pages is already
      # serving, this is a no-op; if it is not, GitHub usually starts serving
      # a gh-pages branch on its own, and if it does not, the next step says
      # what to do.
      - name: Point Pages at the branch
        id: point
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" \
              -f "source[branch]=gh-pages" -f "source[path]=/" > /dev/null
            echo "::notice::Pages is serving gh-pages"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
              -f "source[branch]=gh-pages" -f "source[path]=/" > /dev/null
            echo "::notice::created the Pages site, serving gh-pages"
          fi

      - name: Report where it stands
        env:
          POINTED: ${{ steps.point.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## The book has been published to \`gh-pages\`"
            echo
            echo "<https://bugabinga.github.io/software/>"
            echo
            if [ "$POINTED" = "success" ]; then
              echo "Pages is configured to serve that branch."
            else
              echo "The Pages API refused the workflow token, which is expected"
              echo "on a user-owned repository. GitHub usually begins serving a"
              echo "\`gh-pages\` branch by itself within a minute or two."
              echo
              echo "If the URL above is still a 404 after that, Pages needs to"
              echo "be pointed at the branch once — Settings, Pages, Source:"
              echo "Deploy from a branch, \`gh-pages\` / \`/ (root)\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Should Pages ever be set to build from Actions instead, swap the two
      # steps above for these:
      #
      #   (pin these to commits before uncommenting -- see the rest of the
      #   file; a tag is mutable and everything else here is pinned)
      #   - uses: actions/configure-pages@v6
      #   - uses: actions/upload-pages-artifact@v3
      #     with: { path: dist }
      #   - uses: actions/deploy-pages@v5
