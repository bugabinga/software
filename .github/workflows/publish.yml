name: Publish

# The website is republished on every push to main. The build is the same one
# CI runs, via the shared composite action, with the Pages URL passed in so
# canonical links and the sitemap are absolute.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling, so the last
# push always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` turns Pages on when the workflow token is allowed
      # to; on a user-owned repository it usually is not, and GitHub answers
      # "Resource not accessible by integration". Creating the Pages site is
      # a one-time privileged call, so the next step says exactly how to make
      # it instead of leaving a cryptic action error behind.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain how to enable Pages
        if: steps.pages.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Pages is not enabled yet

          Everything else in this pipeline is automated, but creating the
          Pages site needs a token with administration rights, which the
          workflow token is not. It is one command, once, from anywhere that
          has a token for this repository:

          ```sh
          gh api -X POST repos/${{ github.repository }}/pages -f build_type=workflow
          ```

          The equivalent in the web UI is Settings, Pages, Build and
          deployment, Source: GitHub Actions.

          After that, every push to `main` publishes on its own and this step
          never runs again.
          SUMMARY
          echo "::error::GitHub Pages is not enabled for this repository. See the job summary for the one command that enables it."
          exit 1

      - name: Build the book
        uses: ./.github/actions/build-book
        with:
          base-url: ${{ steps.pages.outputs.base_url }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
