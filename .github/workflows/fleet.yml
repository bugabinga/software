name: Fleet

# Runs a fleet agent in CI, on the occasion that calls for it.
#
# The author's preference is that the fleet runs here rather than in a Claude
# session: a run in CI is triggered by the repository's own events, leaves its
# reasoning in a log anyone can read, and does not depend on someone having a
# session open. Dispatching an agent from a session is for emergencies and for
# work asked for in the moment.
#
# Which agent runs, and what it is told, comes from `.claude/fleet/*.md` via
# `tools/fleet_brief.py` -- not from this file. Changing an agent's
# instructions for a given occasion is then a readable diff in a Markdown
# file, and the routing can be tested without an API key
# (`tools/fleet_brief.py`'s cases, which `mise run check-tools` runs).
#
# Requires an ANTHROPIC_API_KEY repository secret. Without it every run stops
# after routing and says what it would have done, so the triggers can be
# watched working before any money is spent on them.

on:
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "book/chapters/**"
  schedule:
    # Mondays: the machinery. First of the month: the whole book read at once.
    - cron: "0 7 * * 1"
    - cron: "0 8 1 * *"
  issues:
    # Applying a `fleet:` label is how work is asked for from a phone: open an
    # issue from a form, label it, and the agent runs here.
    types: [labeled]
  # A push, relayed. See the `relay` job.
  repository_dispatch:
    types: [fleet]
  workflow_dispatch:
    inputs:
      agent:
        description: Which agent to dispatch
        required: true
        type: choice
        options:
          - pipeline-gardener
          - notes-cartographer
          - prose-editor
          - chapter-drafter
      target:
        description: What to work on (a chapter, a note, a failure)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  # To start CI on the branch the agent pushed. See "Say where it went".
  actions: write
  # claude-code-action exchanges an OIDC token to authenticate, and asks
  # for this by name: without it the run fails with "Could not fetch an OIDC
  # token" after the credential has already resolved, which reads like a bad
  # secret and is not.
  id-token: write

# One agent at a time. Two agents pushing branches from the same base and
# reading each other's half-finished work is not a race worth having.
concurrency:
  group: fleet
  cancel-in-progress: false

jobs:
  # `claude-code-action` refuses to run on `push`: its
  # `src/github/context.ts` throws "Unsupported event type" for anything
  # outside issues, pull requests, the two dispatches, `schedule` and
  # `workflow_run`. So every push touching `notes/` or `book/chapters/`
  # started this workflow, resolved its credential, and died -- the whole
  # "a note arrives, the fleet reacts" path had never once worked, and the
  # failure read as an agent problem rather than an event one.
  #
  # This job is the push, converted into an event the action accepts. It
  # decides the occasion from the diff, exactly as before, and raises a
  # `repository_dispatch` carrying the answer. `GITHUB_TOKEN` can raise one:
  # it is one of the two documented exceptions to the rule that a token's
  # events start no runs.
  relay:
    name: Relay
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fleet-relay
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          python3 tools/occasion.py --event push --relay \
            --before "$BEFORE" --sha "$SHA"

  dispatch:
    name: Dispatch
    # Never on the push itself; `relay` turns that into the dispatch below.
    if: github.event_name != 'push'
    # The credential is an environment secret, so the job has to name the
    # environment to see it at all. If this name is wrong the secret is
    # simply absent and the run says so rather than failing obscurely.
    environment: Fleet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      # Which occasion is this? A push carries its changed paths; a schedule
      # carries the cron that fired it; a manual run carries its own inputs.
      # Which occasion is this, and what does the brief builder need to
      # know? The routing table is data in `tools/occasion.py`, checked
      # against the briefs that exist and against the labels `triage.py`
      # applies -- adding an occasion is a row and a brief, not another arm
      # of a `case` nothing can run.
      - name: Work out the occasion
        id: occasion
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
          TRIGGER: ${{ github.event.client_payload.trigger }}
          CHANGED: ${{ github.event.client_payload.changed }}
        run: |
          python3 tools/occasion.py --event "$EVENT" --cron "$CRON" \
            --label "$LABEL" --issue "$ISSUE" \
            --trigger "$TRIGGER" --changed "$CHANGED"

      # `--export` writes the brief into `$GITHUB_ENV` and the job
      # summary. The three fleet workflows each wrote that heredoc by hand,
      # which is three chances to get the one shape wrong that a multi-line
      # value has to have.
      - name: Build the brief
        id: brief
        if: steps.occasion.outputs.trigger != ''
        env:
          TRIGGER: ${{ steps.occasion.outputs.trigger }}
          CHANGED: ${{ steps.occasion.outputs.changed }}
          AGENT: ${{ inputs.agent }}
          TARGET: ${{ inputs.target }}
          ISSUE: ${{ steps.occasion.outputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          arguments=(--trigger "$TRIGGER" --changed "$CHANGED" --export)
          [ -n "${AGENT:-}" ] && arguments+=(--agent "$AGENT")
          [ -n "${TARGET:-}" ] && arguments+=(--target "$TARGET")

          # An issue carries its own instructions: the form's dropdown names
          # the agent and its fields carry the request, so they are read from
          # the body rather than restated here.
          if [ -n "${ISSUE:-}" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .body \
              > /tmp/issue-body.md
            arguments+=(--issue "$ISSUE" --issue-body-file /tmp/issue-body.md)
          fi

          python3 tools/fleet_brief.py "${arguments[@]}" > /tmp/brief.md

      - name: Is there a credential to run with
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/credential.py

      - name: Run the agent
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        env:
          # The agent shells out to gh; without a token in its own environment
          # every call is an anonymous one against a repository it cannot see.
          GH_TOKEN: ${{ github.token }}
        with:
          # Either credential works: the OAuth token is a Claude
          # subscription, the API key bills separately, and whichever is set
          # is the one the action uses. Both are the tidied values rather
          # than the raw secrets -- see the credential step above.
          claude_code_oauth_token: ${{ env.CLAUDE_OAUTH }}
          anthropic_api_key: ${{ env.CLAUDE_API_KEY }}
          prompt: ${{ env.BRIEF }}
          # What the run is answerable for afterwards.
          #
          # `display_report` writes the Claude Code Report into the job
          # summary: which tools were called, how many turns, how long, what
          # it cost. That is the audit artefact, and it outlives nothing --
          # a job summary goes when the run's logs are pruned -- so it is the
          # first half of the answer, not the whole of it. The durable half
          # is the branch and the pull request the agent leaves behind.
          #
          # It replaces `show_full_output`, which was on to diagnose four
          # dispatches that died in 38ms having called no model and said
          # nothing about why. It did its job -- the answer was a newline in
          # the credential -- and raw JSON in a public repository is not a
          # thing to leave switched on once the question is answered.
          display_report: true
          # Not `use_commit_signing`: it commits through GitHub's API rather
          # than the git CLI, which the action's own security document says
          # "cannot perform complex git operations". Every agent here works
          # by making a branch with git and pushing it, so that input would
          # take the CLI out from under the design in exchange for a Verified
          # badge. `ssh_signing_key` signs without touching git, and needs a
          # signing key on the author's account to exist first.
          # Bots must be allow-listed or the action refuses to run at all:
          # "Workflow initiated by non-human actor". That is what killed the
          # first three dispatches, and it would have made this whole design
          # impossible -- the fleet's own reviewer is a bot, so its review
          # could never have woken the responder, and neither could a label
          # applied through the API.
          #
          # `*` is acceptable here because the triggers already gate access,
          # not the actor list: labelling an issue and pushing to main need
          # write access, a fork's pull request does not receive the
          # environment secret, and the action's own rule about non-write
          # human actors is untouched by this.
          allowed_bots: "*"
          # The model the agent's own definition asks for. It used to be
          # decorative: these definitions are briefs the agent is told to
          # read, not Claude Code subagents, so nothing was reading their
          # frontmatter and every agent ran on whatever the action defaulted
          # to. `tools/fleet_brief.py` resolves the tier to an id.
          claude_args: >-
            --model ${{ steps.brief.outputs.model }}
            --max-turns 60
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"

      # The evidence, kept. `tools/fleet_report.py` reads this to say what the
      # fleet cost and how hard it worked; without it the weekly report can
      # only count runs. `always()` because a run that failed is exactly the
      # one worth having a record of.
      # What this run was for, next to what it cost. The execution output
      # says turns and dollars; without this the report cannot say which
      # agent, which trigger, or what it was pointed at -- `fleet.yml`
      # dispatches six agents and the workflow name tells them apart not at
      # all. `always()` because a run that died is the one worth tracing.
      - name: Record what this run was
        if: always()
        env:
          FLEET_BRANCH: ${{ steps.brief.outputs.branch }}
          FLEET_PR: ${{ '' }}
          OUT: ${{ runner.temp }}/fleet
          TRIGGER: ${{ steps.occasion.outputs.trigger }}
          AGENT: ${{ steps.brief.outputs.agent }}
          MODEL: ${{ steps.brief.outputs.model }}
        run: |
          python3 tools/fleet_record.py --out "$OUT" --trigger "$TRIGGER" \
            --agent "$AGENT" --model "$MODEL" --brief /tmp/brief.md

      - name: Keep the run's record
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-execution-output.json
            ${{ runner.temp }}/fleet/provenance.json
          if-no-files-found: ignore
          retention-days: 90

      # The agent pushes a branch and stops, exactly as it would from a
      # session. agent-branches.yml then opens the pull request and decides
      # about merging, so both routes land in the same place.
      - name: Tell the issue it was picked up
        if: steps.occasion.outputs.issue != '' && steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.occasion.outputs.issue }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 tools/triage.py --mark running --issue "$ISSUE"

          # Written to a file rather than passed inline: the comment ends in a
          # horizontal rule, and a `---` at the start of a line inside a YAML
          # block scalar closes the document.
          cat > /tmp/picked-up.md <<'COMMENT'
          The fleet picked this up. It will link its pull request here, and
          this issue closes when that merges.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          COMMENT
          printf '\n[run](%s)\n' "$RUN" >> /tmp/picked-up.md

          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            -F body=@/tmp/picked-up.md > /dev/null

      - name: Say where it went, and get it checked
        if: steps.key.outputs.present == 'true'
        env:
          BRANCH: ${{ steps.brief.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "::notice::the agent pushed nothing, which is a valid outcome"
            exit 0
          fi

          # The agent pushes with the workflow token, which starts nothing.
          # Why that is, what it broke, and why a dispatch is the way
          # through: `tools/ask_checks.py`. Nothing else about the design
          # changes -- CI runs, its completion fires agent-branches.yml, and
          # the merge decision is still made by rules in the repository.
          python3 tools/ask_checks.py --ref "$BRANCH" ci.yml

      # `fleet:running` was applied and never removed -- not on success, not
      # on failure, not on merge. The one label that says "something is
      # happening here" meant nothing, and a run that died left an issue
      # that looked in flight for ever. `fleet:blocked` was in the roster
      # and applied by nothing at all; this is the edge it exists for.
      #
      # Last, and `always()`. Last because `job.status` reads the steps
      # before it, so anywhere earlier it would report success on a run that
      # was about to fail; `always()` because a run that died is exactly the
      # one whose issue must stop claiming to be running.
      - name: Say how it ended on the issue
        if: always() && steps.occasion.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.occasion.outputs.issue }}
          STATE: ${{ job.status == 'success' && 'done' || 'blocked' }}
        run: python3 tools/triage.py --mark "$STATE" --issue "$ISSUE"
