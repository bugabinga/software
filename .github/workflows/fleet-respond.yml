name: Fleet respond

# Answering review feedback on an open pull request.
#
# The repository's ruleset turns on Copilot's automated review, and a review
# nobody answers is worse than no review: the comments accumulate, the signal
# in them stops being read, and `required_review_thread_resolution` means an
# unanswered thread blocks the merge outright. So every comment ends in a fix
# or in a reply saying why not, and `review-responder` is the agent that does
# it.
#
# Three workflows, three verbs, so it stays clear which one to look at:
#
#   fleet.yml          -- do work on the book. Pushes a branch.
#   fleet-review.yml   -- judge a pull request. Read-only, gates the merge.
#   fleet-respond.yml  -- answer feedback. Pushes to the pull request's branch.

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  # claude-code-action exchanges an OIDC token to authenticate, and asks
  # for this by name: without it the run fails with "Could not fetch an OIDC
  # token" after the credential has already resolved, which reads like a bad
  # secret and is not.
  id-token: write

concurrency:
  # Per pull request, and never cancelled: a half-applied set of review fixes
  # is worse than a slow one.
  group: fleet-respond-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    name: Fleet respond
    # Not on the fleet's own words. `pr-reviewer` posts its verdict as a
    # comment and `review-responder` replies on threads; reacting to those
    # would be two agents talking to each other at the author's expense.
    # A human's review and Copilot's both qualify.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'github-actions[bot]' &&
      (github.event.review.state != 'approved' || github.event.review.body != '')
    # The credential is an environment secret, so the job has to name the
    # environment to see it at all. If this name is wrong the secret is
    # simply absent and the run says so rather than failing obscurely.
    environment: Fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pull request's own branch, because that is where the fixes go.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - name: Is there a credential to run with
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail

          # A secret pasted from a wrapped display carries the wrap with it,
          # and this one did: four live dispatches died having called no
          # model, with "Invalid Authorization header value from
          # CLAUDE_CODE_OAUTH_TOKEN: it contains a line break at character
          # 48". An HTTP header value cannot contain a newline, so the
          # credential was rejected before any request was made.
          #
          # Stripping it here rather than asking for the secret to be pasted
          # again: whitespace is never part of a token, the repair is exact,
          # and a fleet that cannot run because of a stray newline is a fleet
          # that fails again the next time someone types the value in. The
          # warning below is so a repaired secret is still visible as one.
          tidy() { printf '%s' "${1:-}" | tr -d '[:space:]'; }

          oauth=$(tidy "${OAUTH:-}")
          api_key=$(tidy "${API_KEY:-}")
          [ -n "$oauth" ] && echo "::add-mask::$oauth"
          [ -n "$api_key" ] && echo "::add-mask::$api_key"
          {
            echo "CLAUDE_OAUTH=$oauth"
            echo "CLAUDE_API_KEY=$api_key"
          } >> "$GITHUB_ENV"

          if [ -n "$oauth" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::running with CLAUDE_CODE_OAUTH_TOKEN"
            [ "$oauth" = "${OAUTH:-}" ] \
              || echo "::warning::CLAUDE_CODE_OAUTH_TOKEN contained whitespace, which was stripped before use. Re-add it as one line to be rid of this warning."
          elif [ -n "$api_key" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::running with ANTHROPIC_API_KEY"
            [ "$api_key" = "${API_KEY:-}" ] \
              || echo "::warning::ANTHROPIC_API_KEY contained whitespace, which was stripped before use. Re-add it as one line to be rid of this warning."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No credential, so the review feedback on this pull request is unanswered. The comments are still on the thread, but nobody is acting on them."
          fi

      - name: Build the responder's brief
        if: steps.key.outputs.present == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 tools/fleet_brief.py --trigger review-feedback --pr "$PR" > /tmp/brief.md
          {
            echo "BRIEF<<BRIEF_EOF"
            cat /tmp/brief.md
            echo "BRIEF_EOF"
          } >> "$GITHUB_ENV"

      - name: Respond
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        env:
          # The agent shells out to gh; without a token in its own environment
          # every call is an anonymous one against a repository it cannot see.
          GH_TOKEN: ${{ github.token }}
        with:
          # Either credential works: the OAuth token is a Claude
          # subscription, the API key bills separately, and whichever is set
          # is the one the action uses. Both are the tidied values rather
          # than the raw secrets -- see the credential step above.
          claude_code_oauth_token: ${{ env.CLAUDE_OAUTH }}
          anthropic_api_key: ${{ env.CLAUDE_API_KEY }}
          prompt: ${{ env.BRIEF }}
          # What the run is answerable for afterwards.
          #
          # `display_report` writes the Claude Code Report into the job
          # summary: which tools were called, how many turns, how long, what
          # it cost. That is the audit artefact, and it outlives nothing --
          # a job summary goes when the run's logs are pruned -- so it is the
          # first half of the answer, not the whole of it. The durable half
          # is the branch and the pull request the agent leaves behind.
          #
          # It replaces `show_full_output`, which was on to diagnose four
          # dispatches that died in 38ms having called no model and said
          # nothing about why. It did its job -- the answer was a newline in
          # the credential -- and raw JSON in a public repository is not a
          # thing to leave switched on once the question is answered.
          display_report: true
          # Not `use_commit_signing`: it commits through GitHub's API rather
          # than the git CLI, which the action's own security document says
          # "cannot perform complex git operations". Every agent here works
          # by making a branch with git and pushing it, so that input would
          # take the CLI out from under the design in exchange for a Verified
          # badge. `ssh_signing_key` signs without touching git, and needs a
          # signing key on the author's account to exist first.
          # Bots must be allow-listed or the action refuses to run at all:
          # "Workflow initiated by non-human actor". That is what killed the
          # first three dispatches, and it would have made this whole design
          # impossible -- Copilot is a bot, so a Copilot review could never
          # have woken the responder, and neither could a label applied
          # through the API.
          #
          # `*` is acceptable here because the triggers already gate access,
          # not the actor list: labelling an issue and pushing to main need
          # write access, a fork's pull request does not receive the
          # environment secret, and the action's own rule about non-write
          # human actors is untouched by this.
          allowed_bots: "*"
          claude_args: >-
            --max-turns 50
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"

      # The evidence, kept. `tools/fleet_report.py` reads this to say what the
      # fleet cost and how hard it worked; without it the weekly report can
      # only count runs. `always()` because a run that failed is exactly the
      # one worth having a record of.
      - name: Keep the run's record
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-run-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 90
