name: Fleet respond

# Answering review feedback on an open pull request.
#
# A review nobody answers is worse than no review: the comments accumulate and
# the signal in them stops being read. So every comment ends in a fix or in a
# reply saying why not, and `review-responder` is the agent that does it.
#
# Nothing enforces that. `required_review_thread_resolution` is `false` on the
# `Main` ruleset, so an open thread does not block the merge; the responder's
# brief is the whole of the rule.
#
# The reviews it answers are the author's and the fleet's own. Copilot's
# automated review is not among them: it needs a paid Copilot plan, and since
# 1 June 2026 each review also spends Actions minutes -- unbilled here, drawn
# from the account's shared concurrency -- so the `copilot_code_review` rule
# was removed from the ruleset rather than paid for. `pr-reviewer` covers the
# same ground.
#
# Three workflows, three verbs, so it stays clear which one to look at:
#
#   fleet.yml          -- do work on the book. Pushes a branch.
#   fleet-review.yml   -- judge a pull request. Read-only, and required:
#                         `Fleet review` gates the merge on `Main`.
#   fleet-respond.yml  -- answer feedback. Pushes to the pull request's branch.

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  # The fleet's own verdict, which arrives no other way.
  #
  # A review posted with the workflow token starts no run -- "other
  # GITHUB_TOKEN triggered events do not create workflow runs at all" -- so
  # for four months every `pull_request_review` this repository saw from the
  # reviewer woke nothing, and the answering half of the loop existed only on
  # paper (#75). `workflow_run` is not subject to that rule: it fires because
  # a workflow finished, not because an actor did something.
  #
  # The cost is that a `workflow_run` job runs the default branch's copy of
  # this file, with the default branch's secrets, no matter what the pull
  # request contains. That is why the job below refuses anything whose head
  # is not this repository, and why a change to this trigger cannot be tested
  # before it merges.
  workflow_run:
    workflows: ["Fleet review"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run`, to ask for the checks a `GITHUB_TOKEN` push will not
  # start by itself. See the dispatch step at the end.
  actions: write
  # claude-code-action exchanges an OIDC token to authenticate, and asks
  # for this by name: without it the run fails with "Could not fetch an OIDC
  # token" after the credential has already resolved, which reads like a bad
  # secret and is not.
  id-token: write

concurrency:
  # Per pull request, and never cancelled: a half-applied set of review fixes
  # is worse than a slow one.
  group: fleet-respond-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  respond:
    name: Fleet respond
    # Which events are worth waking for, and this is the whole design of the
    # review loop, so it is worth reading rather than skimming.
    #
    # The fleet's own review *should* wake this -- that is the loop the author
    # asked for: the reviewer requests changes on threads, the responder
    # answers and pushes, the push re-runs the reviewer. The earlier rule
    # excluded everything the bot said, which made that impossible.
    #
    # What must not wake it is its own replies. A reply is a
    # `pull_request_review_comment`, so the bot is allowed through only on a
    # `pull_request_review` that requests changes -- never on a comment it
    # wrote itself, and never on a passing review, which needs no answer.
    # The author comes through on either event.
    #
    # A `workflow_run` carries none of that: no review, no actor worth
    # testing, not even a pull request number. All it can be asked here is
    # whether the head is this repository's, because the job is privileged
    # and a fork's branch must never reach it. Everything else about the
    # occasion is resolved in the first step, where a program can ask.
    #
    # The loop is bounded below, in the job, not here: a condition cannot
    # count.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository ||
      github.event_name != 'workflow_run' &&
      github.event.pull_request.draft == false &&
      (
        (github.event_name == 'pull_request_review' &&
         github.event.review.state == 'changes_requested') ||
        (github.actor != 'github-actions[bot]' && github.actor != 'claude[bot]')
      )
    # The credential is an environment secret, so the job has to name the
    # environment to see it at all. If this name is wrong the secret is
    # simply absent and the run says so rather than failing obscurely.
    environment: Fleet
    runs-on: ubuntu-latest
    steps:
      # Three events, one occasion. A review and a review comment carry the
      # pull request; a `workflow_run` carries a branch and, usually, a list
      # of pull requests -- usually, because that list is empty often enough
      # that the branch has to be a fallback rather than a last resort.
      #
      # It also decides whether there is anything to answer at all. On a
      # `workflow_run` the occasion is a verdict, and a verdict that passed
      # needs no answer; asking the reviews API is more honest than reading
      # the run's conclusion, which is also red when the reviewer fell over
      # without judging anything.
      - name: Which pull request, and is there anything to answer
        id: about
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PRS: ${{ join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: |
          set -euo pipefail
          stop() {
            echo "::notice::$1"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          pr="${EVENT_PR:-}"
          [ -n "$pr" ] || pr=$(printf '%s' "${RUN_PRS:-}" | awk '{print $1}')
          if [ -z "$pr" ] && [ -n "${RUN_BRANCH:-}" ]; then
            pr=$(gh api "repos/$REPO/pulls?head=${REPO%%/*}:$RUN_BRANCH&state=open"                    --jq '.[0].number // empty')
          fi
          [ -n "$pr" ] || stop "no open pull request for ${RUN_BRANCH:-this event}"

          branch=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.ref')
          draft=$(gh api "repos/$REPO/pulls/$pr" --jq '.draft')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          [ "$draft" = "false" ] || stop "#$pr is a draft"

          if [ "$EVENT" = "workflow_run" ]; then
            state=$(gh api "repos/$REPO/pulls/$pr/reviews" --paginate \
              --jq '[.[] | select(.body | contains("Fleet review"))] | last | .state // empty')
            [ "$state" = "CHANGES_REQUESTED" ] \
              || stop "the last fleet verdict on #$pr is ${state:-none}, so there is nothing to answer"
          fi

          # The head as it was before the agent ran, so the dispatch step at
          # the end can tell a push from a round that changed nothing.
          head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::answering the review on #$pr ($branch)"

      # `always()`, and not merely unconditional, because there are two ways
      # to reach the record step with no tree and they are not the same way.
      #
      # The five red runs on 2026-09-13 (34788221741, 34788857763,
      # 34789428196, 34790028463, 34790149693) are the first: `about`
      # *succeeded*, set `proceed=false` at "nothing to answer", and this
      # step was skipped by its own `if:` -- which it no longer has.
      #
      # The second is `about` dying: five `gh api` calls under
      # `set -euo pipefail`, and a 5xx ends it. A bare unconditional step
      # would not cover that one, because a step with no `if:` still carries
      # an implicit `success()`. Hence `always()` rather than nothing.
      #
      # What that costs is the provenance, not the row. `runs.jsonl` gets a
      # line for every agent run from the API's own listing -- `append_runs`
      # in `tools/fleet_report.py` writes one with the provenance fields
      # empty when no bundle reached it -- so `docs/FLEET.md`'s "a run that
      # died still gets a line" is the report's promise and was never this
      # step's to keep. This is here to stop a no-op reporting itself as a
      # failure, and to fill in the row while it is at it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: always()
        with:
          # The pull request's own branch, because that is where the fixes go.
          # `about` writes `branch` before both of its later `stop`s, so a
          # no-op run has one too and checks the same tree out. The fallback
          # covers only the two earliest exits -- no open pull request to
          # name -- and a death before that line; any tree will do then,
          # because the only step left writes the record.
          ref: ${{ steps.about.outputs.branch || github.event.repository.default_branch }}
          # Full history, like `fleet.yml:80` and `fleet-review.yml:72`, and
          # not a ternary. `${{ x && 0 || 1 }}` is always 1, because `0` is
          # falsy in an Actions expression and `||` then takes the 1 -- so the
          # answering case would have got the shallow tree it has to commit,
          # fetch and push from. A no-op run paying for history it does not
          # use is the cheaper mistake.
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        if: steps.about.outputs.proceed == 'true'

      # Two agents that answer each other will do it forever if nothing
      # counts. Three rounds is enough to fix what is fixable; a fourth means
      # they disagree, and a disagreement between two agents is the author's
      # to settle, not something to spend another review on.
      - name: How many rounds has this already had
        id: rounds
        if: steps.about.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.about.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rounds=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")
                       | select(.body | contains("Fleet review"))] | length')
          echo "count=$rounds" >> "$GITHUB_OUTPUT"

          if [ "$rounds" -lt 3 ]; then
            echo "over=false" >> "$GITHUB_OUTPUT"
            echo "::notice::round $((rounds + 1)) of at most 3"
            exit 0
          fi

          echo "over=true" >> "$GITHUB_OUTPUT"
          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx 'hold'; then
            echo "::notice::already held after $rounds rounds; saying nothing further"
            exit 0
          fi
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=hold' > /dev/null
          cat > /tmp/held.md <<'COMMENT'
          Three rounds of review and this is still not settled, so the fleet
          has stopped and labelled it `hold`. Two agents disagreeing is not
          something a fourth round fixes, and `agent-branches.yml` will not
          merge anything held.

          The open threads above are the disagreement. Removing `hold` and
          pushing starts the loop again.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          COMMENT
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@/tmp/held.md > /dev/null
          echo "::warning::held after $rounds rounds of review; this one needs the author"

      - name: Is there a credential to run with
        if: steps.rounds.outputs.over == 'false'
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail

          # A secret pasted from a wrapped display carries the wrap with it,
          # and this one did: four live dispatches died having called no
          # model, with "Invalid Authorization header value from
          # CLAUDE_CODE_OAUTH_TOKEN: it contains a line break at character
          # 48". An HTTP header value cannot contain a newline, so the
          # credential was rejected before any request was made.
          #
          # Stripping it here rather than asking for the secret to be pasted
          # again: whitespace is never part of a token, the repair is exact,
          # and a fleet that cannot run because of a stray newline is a fleet
          # that fails again the next time someone types the value in. The
          # warning below is so a repaired secret is still visible as one.
          tidy() { printf '%s' "${1:-}" | tr -d '[:space:]'; }

          oauth=$(tidy "${OAUTH:-}")
          api_key=$(tidy "${API_KEY:-}")
          [ -n "$oauth" ] && echo "::add-mask::$oauth"
          [ -n "$api_key" ] && echo "::add-mask::$api_key"
          {
            echo "CLAUDE_OAUTH=$oauth"
            echo "CLAUDE_API_KEY=$api_key"
          } >> "$GITHUB_ENV"

          if [ -n "$oauth" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::running with CLAUDE_CODE_OAUTH_TOKEN"
            [ "$oauth" = "${OAUTH:-}" ] \
              || echo "::warning::CLAUDE_CODE_OAUTH_TOKEN contained whitespace, which was stripped before use. Re-add it as one line to be rid of this warning."
          elif [ -n "$api_key" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::running with ANTHROPIC_API_KEY"
            [ "$api_key" = "${API_KEY:-}" ] \
              || echo "::warning::ANTHROPIC_API_KEY contained whitespace, which was stripped before use. Re-add it as one line to be rid of this warning."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No credential, so the review feedback on this pull request is unanswered. The comments are still on the thread, but nobody is acting on them."
          fi

      - name: Build the responder's brief
        id: brief
        if: steps.rounds.outputs.over == 'false' && steps.key.outputs.present == 'true'
        env:
          PR: ${{ steps.about.outputs.pr }}
        run: |
          set -euo pipefail
          python3 tools/fleet_brief.py --trigger review-feedback --pr "$PR" > /tmp/brief.md
          {
            echo "BRIEF<<BRIEF_EOF"
            cat /tmp/brief.md
            echo "BRIEF_EOF"
          } >> "$GITHUB_ENV"

      - name: Respond
        if: steps.rounds.outputs.over == 'false' && steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        env:
          # The agent shells out to gh; without a token in its own environment
          # every call is an anonymous one against a repository it cannot see.
          GH_TOKEN: ${{ github.token }}
        with:
          # Either credential works: the OAuth token is a Claude
          # subscription, the API key bills separately, and whichever is set
          # is the one the action uses. Both are the tidied values rather
          # than the raw secrets -- see the credential step above.
          claude_code_oauth_token: ${{ env.CLAUDE_OAUTH }}
          anthropic_api_key: ${{ env.CLAUDE_API_KEY }}
          prompt: ${{ env.BRIEF }}
          # What the run is answerable for afterwards.
          #
          # `display_report` writes the Claude Code Report into the job
          # summary: which tools were called, how many turns, how long, what
          # it cost. That is the audit artefact, and it outlives nothing --
          # a job summary goes when the run's logs are pruned -- so it is the
          # first half of the answer, not the whole of it. The durable half
          # is the branch and the pull request the agent leaves behind.
          #
          # It replaces `show_full_output`, which was on to diagnose four
          # dispatches that died in 38ms having called no model and said
          # nothing about why. It did its job -- the answer was a newline in
          # the credential -- and raw JSON in a public repository is not a
          # thing to leave switched on once the question is answered.
          display_report: true
          # Not `use_commit_signing`: it commits through GitHub's API rather
          # than the git CLI, which the action's own security document says
          # "cannot perform complex git operations". Every agent here works
          # by making a branch with git and pushing it, so that input would
          # take the CLI out from under the design in exchange for a Verified
          # badge. `ssh_signing_key` signs without touching git, and needs a
          # signing key on the author's account to exist first.
          # Bots must be allow-listed or the action refuses to run at all:
          # "Workflow initiated by non-human actor". That is what killed the
          # first three dispatches, and it would have made this whole design
          # impossible -- the fleet's own reviewer is a bot, so its review
          # could never have woken the responder, and neither could a label
          # applied through the API.
          #
          # `*` is acceptable here because the triggers already gate access,
          # not the actor list: labelling an issue and pushing to main need
          # write access, a fork's pull request does not receive the
          # environment secret, and the action's own rule about non-write
          # human actors is untouched by this.
          allowed_bots: "*"
          # The model the agent's own definition asks for. It used to be
          # decorative: these definitions are briefs the agent is told to
          # read, not Claude Code subagents, so nothing was reading their
          # frontmatter and every agent ran on whatever the action defaulted
          # to. `tools/fleet_brief.py` resolves the tier to an id.
          # 70, raised from 50 after a run hit the ceiling mid-answer:
          # `"subtype": "error_max_turns"`, 51 turns, $1.24, nothing pushed
          # and no reply on any thread. Answering a review means reading the
          # diff, the threads and the code under them, and the ceiling is a
          # runaway guard rather than a budget.
          claude_args: >-
            --model ${{ steps.brief.outputs.model }}
            --max-turns 70
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"

      # The other half of the same rule. The agent pushes with the credential
      # `actions/checkout` persisted, which is the workflow token. That push
      # updates a pull request, so the `pull_request` runs it raises are
      # created and then held in an approval-required state -- runs
      # 34760403200 and 34760403209 -- which is silence with extra steps: no
      # CI and no new verdict on the fixes just made. `workflow_dispatch` is
      # an exception the token may still raise, so asking explicitly is the
      # way through; `fleet.yml` hit the same wall from the other side, at
      # its "Say where it went".
      #
      # Both are asked for, not just CI: `Fleet review` is a required check
      # now, so a pull request whose verdict is never re-run is a pull request
      # that cannot merge.
      - name: Ask for the checks the push will not start
        if: steps.rounds.outputs.over == 'false' && steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.about.outputs.branch }}
          PR: ${{ steps.about.outputs.pr }}
          BEFORE: ${{ steps.about.outputs.head }}
        run: |
          set -euo pipefail
          after=$(git rev-parse HEAD)
          if [ "$after" = "$BEFORE" ]; then
            echo "::notice::the responder pushed nothing, which is a valid outcome"
            exit 0
          fi
          # `ci.yml` takes no inputs and needs none: it checks a branch.
          # `fleet-review.yml` reviews a pull request, which a dispatch has
          # to name, because `workflow_dispatch` carries no pull request.
          ask() {
            if gh workflow run "$1" --ref "$BRANCH" "${@:2}" 2> /tmp/dispatch-error; then
              echo "::notice::dispatched $1 on $BRANCH"
            else
              cat /tmp/dispatch-error >&2
              echo "::warning::$BRANCH is pushed but $1 could not be started on it, so #$PR keeps the checks it already had. Start it by hand from the Actions tab."
            fi
          }
          ask ci.yml
          ask fleet-review.yml -f pr="$PR"

      # The evidence, kept. `tools/fleet_report.py` reads this to say what the
      # fleet cost and how hard it worked; without it the weekly report can
      # only count runs. `always()` because a run that failed is exactly the
      # one worth having a record of.
      # What this run was for, next to what it cost. The execution output
      # says turns and dollars; without this the report cannot say which
      # agent, which trigger, or what it was pointed at -- `fleet.yml`
      # dispatches six agents and the workflow name tells them apart not at
      # all. `always()` because a run that died is the one worth tracing --
      # which is only true if there is a tree to run this from, and see the
      # checkout above for why there now always is.
      - name: Record what this run was
        if: always()
        env:
          FLEET_BRANCH: ${{ steps.about.outputs.branch }}
          FLEET_PR: ${{ steps.about.outputs.pr }}
        run: |
          python3 tools/fleet_record.py \
            --out "${{ runner.temp }}/fleet" \
            --trigger review-feedback \
            --agent "review-responder" \
            --model "${{ steps.brief.outputs.model }}" \
            --brief /tmp/brief.md

      - name: Keep the run's record
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-execution-output.json
            ${{ runner.temp }}/fleet/provenance.json
          if-no-files-found: ignore
          retention-days: 90
