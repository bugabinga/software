name: Fleet review

# The fleet reviewing its own work before it merges.
#
# The author's intention for branch protection was never "a human must
# approve" -- it was "this must be reviewed", and the reviewer is the fleet.
# That is built as a **status check** rather than as an approving review, on
# purpose: a check from Actions gates a merge in a way nothing argues with,
# whereas whether a bot's approval satisfies a required-reviews rule is a
# question about GitHub's internals that would have to be true forever.
#
# So: this job is named `Fleet review`, and once it is added to the branch
# ruleset's required checks, nothing merges without the fleet having read it.
#
# Sequencing matters. Do not make this check required until an
# ANTHROPIC_API_KEY exists and a few real pull requests have been through it:
# a required check that can never pass would brick the repository. Without a
# key it passes with a notice, so adding the workflow now is safe and making
# it required later is the deliberate step.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-code-action exchanges an OIDC token to authenticate, and asks
  # for this by name: without it the run fails with "Could not fetch an OIDC
  # token" after the credential has already resolved, which reads like a bad
  # secret and is not.
  id-token: write

concurrency:
  # Per pull request, and cancel superseded runs: a review of an old head is
  # worse than no review, because it looks like a review of the new one.
  group: fleet-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Fleet review
    if: github.event.pull_request.draft == false
    # The credential is an environment secret, so the job has to name the
    # environment to see it at all. If this name is wrong the secret is
    # simply absent and the run says so rather than failing obscurely.
    environment: Fleet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Is there a credential to run with
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          if [ -n "${OAUTH:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::running with CLAUDE_CODE_OAUTH_TOKEN"
          elif [ -n "${API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::running with ANTHROPIC_API_KEY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No credential, so no review happened. This check passes so that requiring it before the fleet is armed cannot lock the repository -- but it is not a review."
          fi

      - name: Build the reviewer's brief
        if: steps.key.outputs.present == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 tools/fleet_brief.py --trigger pull-request --pr "$PR" > /tmp/brief.md
          {
            echo "BRIEF<<BRIEF_EOF"
            cat /tmp/brief.md
            echo "BRIEF_EOF"
          } >> "$GITHUB_ENV"

      - name: Install the toolchain the reviewer will need
        if: steps.key.outputs.present == 'true'
        run: |
          tools/install-typst.sh
          # Every command in the reviewer's brief is a gh command. Without
          # this it ran, found no gh, and produced neither a verdict nor a
          # comment -- which the verdict step then correctly called a failure.
          tools/install-gh.sh

      - name: Review
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # The agent shells out to gh; without a token in its own environment
          # every call is an anonymous one against a repository it cannot see.
          GH_TOKEN: ${{ github.token }}
        with:
          # Either credential works. The OAuth token is a Claude subscription;
          # the API key bills separately. Whichever is set in the environment
          # is the one the action uses.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ env.BRIEF }}
          # The action hides the agent's output "for security" and reports
          # only `is_error: true`. Two live dispatches died in 38ms having
          # called no model, and no amount of reading the log said why --
          # `--debug` in claude_args is not the lever, this input is.
          #
          # This repository is public, so what the agent prints is public
          # with it. Actions masks the secrets; the rest is repository
          # content the agent could read anyway. Turn it off again once the
          # fleet is known to work.
          # Bots must be allow-listed or the action refuses to run at all:
          # "Workflow initiated by non-human actor". That is what killed the
          # first three dispatches, and it would have made this whole design
          # impossible -- Copilot is a bot, so a Copilot review could never
          # have woken the responder, and neither could a label applied
          # through the API.
          #
          # `*` is acceptable here because the triggers already gate access,
          # not the actor list: labelling an issue and pushing to main need
          # write access, a fork's pull request does not receive the
          # environment secret, and the action's own rule about non-write
          # human actors is untouched by this.
          allowed_bots: "*"
          show_full_output: true
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash,Read,Grep,Glob"

      # The verdict is a file, not a mood. A reviewer that fell over, ran out
      # of turns, or decided to say nothing leaves no file, and that counts as
      # a failure: silence must never read as approval.
      - name: Read the verdict
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail

          # claude-code-action refuses to run when the workflow invoking it
          # differs from the copy on the default branch -- a guard against a
          # pull request rewriting the reviewer that reviews it. It then exits
          # *successfully*, leaving no verdict, which is not the same thing as
          # a reviewer that produced nothing and must not be failed as one.
          #
          # The hole this leaves is the reason `.github/` is in the protected
          # set: a change to the automation is not merged without a human.
          git fetch -q --depth=1 origin main 2>/dev/null || true
          if ! git diff --quiet FETCH_HEAD -- .github/workflows/fleet-review.yml 2>/dev/null; then
            echo "::notice::This pull request changes fleet-review.yml itself, so the action declined to run and there is no review. Merging it is what makes the next pull request reviewable."
            {
              echo "### Fleet review: **skipped**"
              echo
              echo "This pull request changes \`fleet-review.yml\`, and the action"
              echo "will not run a workflow that differs from the default branch's"
              echo "copy of it. Nothing was reviewed. Changes under \`.github/\`"
              echo "need a human anyway."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ ! -f /tmp/fleet-review.json ]; then
            echo "::error::The reviewer left no verdict at /tmp/fleet-review.json. Treating that as a failed review: silence is not a pass."
            exit 1
          fi

          python3 - <<'VERDICT'
          import json, os, sys, pathlib

          data = json.loads(pathlib.Path("/tmp/fleet-review.json").read_text())
          verdict = data.get("verdict")
          summary = data.get("summary", "").strip() or "(no summary given)"
          findings = data.get("findings") or []

          lines = [f"### Fleet review: **{verdict}**", "", summary, ""]
          if findings:
              lines += ["| Where | What | Why |", "| --- | --- | --- |"]
              for f in findings:
                  where = str(f.get("where", "")).replace("|", "\\|")
                  what = str(f.get("what", "")).replace("|", "\\|")
                  why = str(f.get("why", "")).replace("|", "\\|")
                  lines.append(f"| `{where}` | {what} | {why} |")
          else:
              lines.append("_No findings._")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("\n".join(lines) + "\n")

          if verdict != "pass":
              print(f"::error::Fleet review failed: {summary}")
              sys.exit(1)
          print(f"::notice::Fleet review passed: {summary}")
          VERDICT
