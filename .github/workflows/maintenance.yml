name: Maintenance

# The deterministic half of maintaining the book: work that needs no
# judgement, so it needs no agent. Runs weekly and on demand.
#
# The agents (see docs/FLEET.md) handle everything this cannot: reading the
# rendered output after a Typst upgrade, rewriting a sentence whose citation
# died, deciding what new notes mean for the book's shape.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour so it does not queue behind everyone
    # else's cron.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  # Dependabot watches the actions. Nothing watches the binaries this
  # repository pins by writing a version into a file, so this does.
  pinned-tools:
    name: Pinned tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare every pin against its latest release
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_of() { gh api "repos/$1/releases/latest" --jq .tag_name | sed 's/^v//'; }

          # Every pin in mise.toml, against its upstream. Dependabot has no
          # mise ecosystem -- nor asdf, nor .tool-versions -- so this is the
          # only thing watching these, and adding a tool to the manifest is
          # enough to get it watched.
          # Where each tool's real version comes from. Not always a GitHub
          # release: wrangler ships from the `workers-sdk` monorepo, whose
          # tags belong to whichever package was cut, so asking that repo
          # returns a number that has nothing to do with wrangler. npm is the
          # authority for it, and mise resolves it as `npm:wrangler` too.
          declare -A upstream=(
            [typst]=gh:typst/typst
            [typos]=gh:crate-ci/typos
            [gh]=gh:cli/cli
            [typstyle]=gh:typstyle-rs/typstyle
            [wrangler]=npm:wrangler
          )

          latest_from() {
            case "$1" in
              gh:*)  latest_of "${1#gh:}" ;;
              npm:*) npm view "${1#npm:}" version 2>/dev/null ;;
              *)     return 1 ;;
            esac
          }

          behind=0
          rows=""
          while IFS=$'\t' read -r tool pinned; do
            repo="${upstream[$tool]:-}"
            if [ -z "$repo" ]; then
              rows+="| \`$tool\` | $pinned | — | not watched: no upstream recorded |"$'\n'
              continue
            fi
            latest=$(latest_from "$repo" 2>/dev/null || echo "?")
            if [ "$latest" = "?" ]; then
              rows+="| \`$tool\` | $pinned | ? | could not ask $repo |"$'\n'
            elif [ "$pinned" = "$latest" ]; then
              rows+="| \`$tool\` | $pinned | $latest | current |"$'\n'
            else
              rows+="| \`$tool\` | $pinned | $latest | **behind** |"$'\n'
              behind=$((behind + 1))
            fi
          done < <(python3 tools/pinned.py --all)

          typst_pinned=$(python3 tools/pinned.py typst)
          typst_latest=$(latest_of typst/typst)

          {
            echo "### Pinned tools"
            echo
            echo "| Tool | Pinned | Latest | |"
            echo "| --- | --- | --- | --- |"
            printf '%s' "$rows"
            echo
            echo "$behind behind. Only Typst is bumped automatically, and only"
            echo "when the book still builds on it; the rest are reported."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$behind pinned tool(s) behind upstream"

          # gh and typos are checked but not bumped here: nothing the book
          # renders depends on them, so they are reported and left. Typst is
          # different -- it decides what the book looks like -- so a bump gets
          # built and gated before anyone sees it.
          for tool in gh typos; do
            eval "pinned=\$${tool}_pinned latest=\$${tool}_latest"
            if [ "$pinned" != "$latest" ]; then
              echo "::notice::$tool $pinned is behind $latest"
            fi
          done

          echo "pinned=$typst_pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$typst_latest" >> "$GITHUB_OUTPUT"
          if [ "$typst_pinned" = "$typst_latest" ]; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Typst $typst_pinned is current"
          else
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Typst $typst_pinned is behind $typst_latest"
          fi

      - name: Bump the pin
        if: steps.versions.outputs.behind == 'true'
        run: |
          python3 - "${{ steps.versions.outputs.latest }}" <<'BUMP'
          import pathlib, re, sys
          p = pathlib.Path("mise.toml")
          p.write_text(re.sub(r'^typst = ".*"$', f'typst = "{sys.argv[1]}"',
                              p.read_text(), count=1, flags=re.M))
          BUMP

      # If the book does not build and pass every gate on the new version,
      # this fails and no pull request is opened -- which is the point. An
      # upgrade that needs work becomes a red run to look at, not a silent
      # bump.
      - name: Build the book on the new version
        if: steps.versions.outputs.behind == 'true'
        uses: ./.github/actions/build-book

      - name: Type-check the example code
        if: steps.versions.outputs.behind == 'true'
        run: tools/check_code.sh

      - name: Open or update the upgrade pull request
        if: steps.versions.outputs.behind == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: maintenance/typst-${{ steps.versions.outputs.latest }}
          delete-branch: true
          commit-message: |
            Upgrade Typst to ${{ steps.versions.outputs.latest }}

            Built and checked on the new version before this was opened.
          title: "Upgrade Typst to ${{ steps.versions.outputs.latest }}"
          labels: chore
          body: |
            Typst ${{ steps.versions.outputs.pinned }} → ${{ steps.versions.outputs.latest }}.

            The book was built and every gate run on the new version before
            this pull request was opened: strict build, internal links,
            spelling, and the example code under `code/`.

            **Not yet verified: what the export actually looks like.** Typst's
            HTML export is experimental, and a build that passes can still
            change the markup the page shell wraps — headings shifted by a
            different amount, a different shape of `<math>`, new content in
            `<head>`. Before merging, someone (or the `pipeline-gardener`
            agent) should read a rendered chapter and compare.

            Release notes: https://github.com/typst/typst/releases/tag/v${{ steps.versions.outputs.latest }}

            ---
            _Generated by [Claude Code](https://claude.ai/code)_

  link-rot:
    name: Link rot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the book
        uses: ./.github/actions/build-book

      - name: Restore the lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .lycheecache
          key: lychee-maintenance-${{ github.run_id }}
          restore-keys: lychee-

      # Self-canonical links, og:url and every sitemap entry point at the
      # site being built, and cannot resolve before its first deployment.
      # Reading the URL out of the build keeps it out of lychee.toml.
      - name: Work out the site's own URL
        id: site
        run: |
          set -euo pipefail
          pattern=$(python3 -c 'import json, re; base = json.load(open("dist/build-info.json")).get("base_url", ""); print("^" + re.escape(base) if base else "^https://never.invalid/")')
          echo "exclude=$pattern" >> "$GITHUB_OUTPUT"
          echo "::notice::excluding $pattern from the outbound link check"

      - name: Check outbound links
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --config lychee.toml --cache --max-cache-age 1d
            --exclude "${{ steps.site.outputs.exclude }}" dist
          output: lychee-report.md
          fail: true

      # One issue, updated rather than duplicated: link rot is a standing
      # condition, not a new event every week.
      - name: Report dead links
        if: steps.lychee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Dead outbound links in the book"
          body=$(mktemp)
          {
            echo "The weekly link check found links that no longer resolve."
            echo
            echo "A dead citation is not fixed by deleting it: replace it with"
            echo "an archived copy or a live equivalent, and if neither exists,"
            echo "rewrite the sentence so it does not depend on the link."
            echo
            cat lychee-report.md 2>/dev/null || echo "(no report file was produced)"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "$body"

          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body" --label chore
          fi
