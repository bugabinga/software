# Every tool this repository pins, in one file.
#
# They used to be scattered: Typst in `.typst-version`, typos in a `env:` block
# in `ci.yml`, wrangler in another one in `worker-deploy.yml`, each with its
# own download script. Adding typstyle would have made a fourth. This is the
# manifest instead, and `mise install` gets a working machine from it.
#
# ## What Dependabot does about this: nothing
#
# There is no `mise` ecosystem, and none for asdf or `.tool-versions` either --
# the supported list is bazel, bun, bundler, cargo, composer, conda, deno,
# devcontainers, docker, docker-compose, dotnet-sdk, helm, mix, julia, elm,
# gitsubmodule, github-actions, gomod, gradle, maven, nix, npm, nuget,
# opentofu, pip, pre-commit and pub.
#
# So the fleet does it. `maintenance.yml` reads every pin here on Mondays and
# compares it against the tool's latest release, which is what it already did
# for Typst alone. That is not a workaround: Dependabot was never going to
# cover a downloaded binary, which is why `dependabot.yml` says it covers the
# Actions and `maintenance.yml` covers the rest.
#
# ## Why the versions matter
#
# Typst's HTML export is experimental and an unpinned upgrade would change the
# site's markup underneath the pipeline. The others are pinned for the duller
# reason: a build that installs "latest" is a build whose output depends on
# the day it ran.

[tools]
# The compiler. Bump with `maintenance.yml`, never by hand, and look at a
# built chapter afterwards -- see CLAUDE.md.
typst = "0.15.1"

# Spelling, over the whole repository. Configured in `.typos.toml`.
# 1.50.1 is out; this is what the repository actually runs, and a bump is
# a decision (a newer typos finds new words) rather than a tidy-up.
typos = "1.36.0"

# The GitHub CLI, used by the fleet's workflows and by `tools/*.py`.
gh = "2.63.2"

# One formatter per language the repository writes by hand, and no language
# without one. Formatting is a gate here, not a preference: a diff that mixes
# a change with a reflow costs the reader the ability to see the change, and
# on a phone it costs them the diff entirely.
#
# `.typ`.
typstyle = "0.15.1"

# `.py`, formatter and linter both. Rules in `ruff.toml`, which says why each
# switched-off rule is switched off.
ruff = "0.15.8"

# Type checker for `.py`. Configured in `ty.toml`. Pre-1.0 and pinned exactly
# like everything else here, so it moves when `maintenance.yml` proposes a
# bump and somebody reads the diff, not on its own.
ty = "0.0.80"

# `.js`, `.mjs`, `.json`, `.jsonc`, `.css` -- formatter and linter both,
# configured in `biome.json`. A single binary, which is the whole reason it is
# this and not prettier: `README.md` promises no package manager, lockfile or
# `node_modules`, and prettier is all three.
biome = "2.5.13"

# `.md`, `.toml` and `.yml`, via three wasm plugins named in `dprint.json`.
dprint = "0.57.4"

# `.sh`. Four scripts and 195 lines, which was the last language here with no
# formatter at all.
shfmt = "3.14.1"

# actionlint runs shellcheck over every `run:` block *if it can find one*, and
# says nothing when it cannot. That silence is why a local run disagreed with
# CI for a whole afternoon: the runner had shellcheck and this machine did
# not, so six findings existed only in CI. Pinned, so both see the same six --
# which are now none.
shellcheck = "0.11.0"

# Run by `worker-deploy.yml` and `preview.yml`, and nowhere else. Recorded
# here so the version lives with the others rather than in a workflow's
# `env:` block, which is where it used to be.
wrangler = "4.131.1"

# Lints the workflow definitions properly: expression syntax, event and
# context validity, shellcheck over every `run:` block. `check_workflows.py`
# only ever checked YAML validity, heredocs and tabs.
actionlint = "1.7.12"

# Outbound link checking. The task used to begin "if lychee is installed";
# now it is, so the branch is gone.
lychee = "0.24.2"

# For the notes inbox's tests and the skill generator's zip check, both of
# which are plain web-standard JavaScript with no dependencies.
node = "26.8.2"

# Python is deliberately absent. Every tool in `tools/` is standard library
# only, so mise-managing an interpreter would mean installing one on every
# runner to run scripts that need nothing from it. `python3` is a
# prerequisite here in the way `sh` and `git` are.

[env]
# Overridable: `OUT=out mise run build`.
OUT = "dist"
DAYS = "7"

# --------------------------------------------------------------------------
# Tasks. `mise tasks` lists them; `mise run check` is what CI runs.
#
# One definition per task, and CI calls it rather than restating the command
# in a `run:` block. That was the real duplication: `make check-workflows` and
# ci.yml's "Check the workflow definitions" were the same line written twice,
# free to drift apart, and nothing would have noticed.
# --------------------------------------------------------------------------

[tasks.setup]
description = "Install the pinned toolchain"
run = "mise install"

[tasks.build]
description = "Build the website and the PDF"
run = "python3 tools/build.py --out $OUT"

[tasks.html]
description = "Build the website only, skipping the PDF"
run = "python3 tools/build.py --out $OUT --no-pdf"

[tasks.pdf]
description = "Build the PDF only"
run = "python3 tools/build.py --out $OUT --pdf-only"

[tasks.serve]
description = "Build, serve on :8000, rebuild and reload on every save"
run = "python3 tools/build.py --out $OUT --serve"

[tasks.watch]
description = "Rebuild on every save, without serving"
run = "python3 tools/build.py --out $OUT --watch"

[tasks.build-strict]
description = "Build with warnings treated as failures"
run = "python3 tools/build.py --out $OUT --strict"

[tasks.check-links]
description = "Internal links and anchors in the built site"
depends = ["build-strict"]
run = "python3 tools/check_links.py $OUT"

[tasks.check-external-links]
description = "Outbound links, with lychee"
run = "lychee --config lychee.toml $OUT"

[tasks.check-spelling]
description = "Spelling, over the whole repository"
run = "typos"

[tasks.check-code]
description = "Type-check the example code under code/"
run = "tools/check_code.sh"

[tasks.check-epub]
description = "The EPUB is a well-formed EPUB 3 container"
depends = ["build-strict"]
run = "python3 tools/check_epub.py $OUT/book.epub"

[tasks.check-worker]
description = "The notes inbox worker"
run = "node worker/notes-intake/test.mjs"

[tasks.check-workflows]
description = "The Actions definitions, and that every tool compiles"
# No severity filter. The four `info` findings this used to hide were
# backticks and sed syntax inside single quotes, all correct; each now
# carries a `# shellcheck disable=SC2016` and a reason at the line it is
# about. A blanket filter hides the next finding too.
run = [
  "actionlint",
  "python3 tools/check_workflows.py --self-test",
  "python3 tools/check_workflows.py",
]

[tasks.check-lint]
description = "Lint the Python and the JavaScript, strictly"
# `site/templates/` is out of biome's reach in both tasks: those files carry
# `{{placeholder}}` inside `<style>` and `lang="{{lang}}"`, which no HTML or
# CSS parser accepts and which `tools/build.py` substitutes before anything
# renders them. Their findings were false for that reason, not ignored.
# `--error-on-warnings`, because without it biome exits 0 on a warning:
# `CLAUDE.md` says a warning fails the build like an error does, and that was
# true of every gate here except this one. Measured on the head before
# `biome.jsonc`'s override landed -- the skill page's two `noImportantStyles`
# warnings gave exit 0 bare and exit 1 with the flag. That override switches
# the rule off for the only file in the tree carrying `!important`
# (`site/skill/index.html:400`), so nothing in the tree exercises the flag
# today: it is armed for the next warning, not holding a current one. It does
# not cover biome's `info` tier, which has no such flag; those are visible in
# the output and fixed rather than gated.
# `ruff check` already exits non-zero on any finding.
run = [
  "ruff check tools/",
  "biome lint --error-on-warnings worker/ site/assets/ site/skill/",
]

[tasks.check-types]
description = "Type-check the Python"
run = "ty check tools/"

[tasks.check-report]
description = "The report's narrowing, the run record, and the previews"
run = [
  "python3 tools/fleet_report.py --self-test",
  "python3 tools/fleet_record.py --self-test",
  "python3 tools/preview.py --self-test",
  "python3 tools/cloudflare.py --self-test",
]

[tasks.check-fleet]
description = "Every brief routes to an agent, and the review builder's arithmetic"
run = ["python3 tools/fleet_brief.py --self-test"]

[tasks.check-format]
description = "Every hand-written file is formatted the one way"
# `git ls-files` rather than a directory list: a `.typ` added outside `book/`
# was already unformatted and nothing said so. The gate should find files by
# what they are, not by where somebody remembered to look.
run = [
  "git ls-files -z '*.typ' | xargs -0 typstyle --check",
  "ruff format --check tools/",
  "biome format worker/ site/assets/ site/skill/",
  "dprint check",
  "shfmt --diff $(git ls-files '*.sh')",
]

[tasks.format]
description = "Format everything in place"
run = [
  "git ls-files -z '*.typ' | xargs -0 typstyle --inplace",
  "ruff format tools/",
  "biome format --write worker/ site/assets/ site/skill/",
  "dprint fmt",
  "shfmt --write $(git ls-files '*.sh')",
]

[tasks.check-skill]
description = "The skill generator's page builds a zip both node and Python read"
run = [
  "python3 tools/check_skill_page.py",
  "python3 tools/make_skill.py --self-test",
]

[tasks.check-branches]
description = "What a green agent branch has earned, and the shared workflow floor"
run = [
  "python3 tools/fleetlib.py --self-test",
  "python3 tools/credential.py --self-test",
  "python3 tools/occasion.py --self-test",
  "python3 tools/pin_report.py --self-test",
  "python3 tools/respond.py --self-test",
  "python3 tools/triage.py --self-test",
  "python3 tools/agent_branch.py --self-test",
]

[tasks.check-review]
description = "The review builder's line arithmetic"
run = "python3 tools/post_review.py --self-test"

[tasks.check-prose]
description = "The mechanical faults in the chapters a program can decide"
run = ["python3 tools/prose_scan.py --self-test", "python3 tools/prose_scan.py"]

[tasks.check-settings-logic]
description = "repo_state.py's comparison rules, without a network"
# Its own task because it needs no credential and no network, so it is worth
# running where `check-settings` cannot reach the API at all.
run = "python3 tools/repo_state.py --self-test"

[tasks.check-settings]
description = "The repository's settings, against what repo.toml declares"
# Reads GitHub and compares; it never writes. A section the token cannot see
# is reported as unread rather than as agreement, so a run behind a proxy
# that refuses whole API paths says what it managed to look at rather than
# calling silence agreement. `ci.yml`'s Check step passes `github.token`, so
# the rulesets and half of `[repository]` are compared there. Not the rest:
# the repository object a `contents: read` token receives has no merge
# settings in it at all, so those read unread in CI and are compared only
# where somebody holds a wider credential -- `TRIMMED_BY_PERMISSION` in
# `tools/repo_state.py` is the list, and `repo.toml` points at it rather than
# counting it, for the same reason. `actions` needs administration and is
# unread everywhere but the apply.
#
# It could not be wired until #81 merged: it was red on four declared and
# unapplied settings, and a gate red on the merge that would satisfy it is a
# gate that blocks its own fix. Run 34791533048 applied them.
#
# The same shape recurs on every branch that changes a value in `repo.toml`,
# so it is handled rather than avoided: `unapplied_reason` compares the
# settings this checkout declares against the ones the last successful
# `settings.yml` run was applied from, and compares nothing when they differ.
# Values, not bytes -- that file is mostly prose. See its docstring.
depends = ["check-settings-logic"]
run = "python3 tools/repo_state.py --check"

[tasks.check]
description = "Every gate CI runs"
# check-skill (#60), check-review (#61) and check-prose (#66) landed on main
# while this branch carried the migration, each as a Makefile target and a
# `run:` step in ci.yml. Here they are tasks, called once, by both.
depends = [
  "build-strict",
  "check-links",
  "check-epub",
  "check-worker",
  "check-code",
  "check-workflows",
  "check-fleet",
  "check-format",
  "check-spelling",
  "check-skill",
  "check-branches",
  "check-review",
  "check-prose",
  "check-lint",
  "check-types",
  "check-report",
  "check-settings-logic",
  "check-settings",
]
run = "echo 'all checks passed'"

[tasks.notes]
description = "Download a source into notes/ (mise run notes -- URL)"
run = "python3 tools/ingest_notes.py"

[tasks.reindex-notes]
description = "Rebuild notes/index.md"
run = "python3 tools/ingest_notes.py --reindex"

[tasks.fleet-report]
description = "Judge the fleet: runs, cost, branches, what is stuck"
run = "python3 tools/fleet_report.py --days $DAYS --html build/fleet-report.html"

[tasks.clean]
description = "Remove build output"
run = "rm -rf $OUT build"
