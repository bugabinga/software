# The book manifest: the single source of truth for metadata and chapter order.
#
# Read by `book/book.typ` (via typst's `toml()`) for the PDF build and by
# `tools/build.py` for the website build, so metadata and ordering never drift
# between the two outputs.

[book]
# PLACEHOLDER. The real title is not decided yet, and this one was invented
# by the pipeline to have something to render. Changing it is one line here
# plus the heading of README.md, and nothing else in the tree hardcodes it --
# the website, the PDF, the Open Graph tags, the search index and the social
# card all read this value. Do not let it become the title by inertia.
title = "A Book Written in Types"
subtitle = "Working title"
authors = ["bugabinga"]
description = "A book whose source is Typst, built to a website and a PDF by one pipeline."
language = "en"

# Absolute URL the site is published under. Used for <link rel=canonical>,
# sitemap.xml and Open Graph tags. Leave empty to omit those.
# For GitHub Pages project sites this is https://<user>.github.io/<repo>/
base-url = "https://bugabinga.github.io/software/"

# Shown in the footer and on the title page. Bump per release, or set to
# "draft" while writing.
edition = "draft"

# Repository the "edit this page" links point at. Leave empty to hide them.
repository = "https://github.com/bugabinga/software"
edit-branch = "main"

# Parts group chapters in the sidebar and get a title page in the PDF.
# `numbered = false` marks front/back matter: no chapter numbers, excluded
# from the numbering sequence. A part with an empty `title` is not shown as a
# group; its chapters sit at the top level.

[[part]]
title = ""
numbered = false
chapters = ["chapters/00-preface.typ"]

# The two parts and the appendix are the structure fixed in
# notes/2026-09-11-session-01-foundations-and-craft.md, line 268, under
# "Book decisions". The chapter order is that line's order.

[[part]]
title = "Part I: Foundations"
numbered = true
chapters = [
  "chapters/01-machine-and-program.typ",
  "chapters/02-information-and-entropy.typ",
  "chapters/03-knowledge.typ",
  "chapters/04-software-and-its-forms.typ",
  "chapters/05-operating-systems.typ",
]

[[part]]
title = "Part II: Craft"
numbered = true
chapters = [
  "chapters/06-learning-the-craft.typ",
  "chapters/07-beauty-and-mechanical-sympathy.typ",
  "chapters/08-the-cycle-and-its-costs.typ",
  "chapters/09-the-practices.typ",
  "chapters/10-intent-and-product-engineering.typ",
]

[[part]]
title = "Appendices"
numbered = false
chapters = [
  "chapters/90-open-questions.typ",
  "chapters/91-agents.typ",
  "chapters/92-citations.typ",
  "chapters/93-glossary.typ",
  "chapters/99-prelude-reference.typ",
]
