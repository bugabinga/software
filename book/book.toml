# The book manifest: the single source of truth for metadata and chapter order.
#
# Read by `book/book.typ` (via typst's `toml()`) for the PDF build and by
# `tools/build.py` for the website build, so metadata and ordering never drift
# between the two outputs.

[book]
title = "A Book Written in Types"
subtitle = "Working title"
authors = ["bugabinga"]
description = "A book whose source is Typst, built to a website and a PDF by one pipeline."
language = "en"

# Absolute URL the site is published under. Used for <link rel=canonical>,
# sitemap.xml and Open Graph tags. Leave empty to omit those.
# For GitHub Pages project sites this is https://<user>.github.io/<repo>/
base-url = "https://bugabinga.github.io/software/"

# Shown in the footer and on the title page. Bump per release, or set to
# "draft" while writing.
edition = "draft"

# Repository the "edit this page" links point at. Leave empty to hide them.
repository = "https://github.com/bugabinga/software"
edit-branch = "main"

# Parts group chapters in the sidebar and get a title page in the PDF.
# `numbered = false` marks front/back matter: no chapter numbers, excluded
# from the numbering sequence. A part with an empty `title` is not shown as a
# group; its chapters sit at the top level.

[[part]]
title = ""
numbered = false
chapters = ["chapters/00-preface.typ"]

[[part]]
title = "Part I: The Pipeline"
numbered = true
chapters = ["chapters/01-the-pipeline.typ"]

[[part]]
title = "Appendices"
numbered = false
chapters = ["chapters/99-prelude-reference.typ"]
